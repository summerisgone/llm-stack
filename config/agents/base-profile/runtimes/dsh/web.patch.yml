# `dsh web --patch` overlay (agent-adapter dsh.mjs). All interfaces, so
# agent-broker's web proxy reaches the pod on :3080; the NetworkPolicy admits
# only the broker. The CLI refuses `--host 0.0.0.0`, the config row does not.
# A patch replaces the row's whole config, hence the restated keys.
- id: webserver
  config:
    host: 0.0.0.0
    port: 3080
    compression: gzip
    compressionLevel: 1
    compressionThresholdBytes: 1024
