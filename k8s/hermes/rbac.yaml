# The broker may manage agent Pods and create profile PVCs and hermes-cred-*
# Secrets in this namespace only. It cannot delete PVCs: profiles are
# removed only by scripts/hermes-profile-delete.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: hermes-broker
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: hermes-broker
rules:
  - apiGroups: [""]
    resources: [pods]
    verbs: [get, list, watch, create, delete, patch]
  - apiGroups: [""]
    resources: [persistentvolumeclaims]
    verbs: [get, list, create, patch]
  # RBAC cannot restrict `create` by name; the broker only ever creates
  # hermes-cred-<id>.
  - apiGroups: [""]
    resources: [secrets]
    verbs: [get, create, update, patch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: hermes-broker
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: hermes-broker
subjects:
  - kind: ServiceAccount
    name: hermes-broker
---
# pat-service issues a user's Hermes inference key from /platform
# (pat-service/cmd/pat-service/hermes.go): it writes INFERENCE_KEY into
# hermes-cred-<id> and deletes the agent pod so the next start reads it.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: pat-service-hermes-key
rules:
  - apiGroups: [""]
    resources: [secrets]
    verbs: [get, create, patch]
  - apiGroups: [""]
    resources: [pods]
    verbs: [delete]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: pat-service-hermes-key
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: pat-service-hermes-key
subjects:
  - kind: ServiceAccount
    name: pat-service
    namespace: airgap-ai-stack
