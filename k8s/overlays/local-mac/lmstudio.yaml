# LOCAL-MAC PROFILE ONLY.
#
# The LM Studio inference path: the minimal Envoy upstream that is the one
# workload allowed to reach the LAN LM Studio server, its Envoy Gateway
# Backend, the private AIGatewayRoute and the Keycloak JWT / per-user
# rate-limit policies that guard it. The remote GPU profile has no LM Studio
# and gets its inference route from helm/airgap-stack/templates/llmd.yaml, so
# none of this belongs in k8s/base.
#
# SITE-SPECIFIC: the LM Studio LAN address in the Envoy cluster below.
# The upstream is intentionally a minimal Envoy proxy. It is the only workload
# permitted to reach the LAN address of the host LM Studio server.
apiVersion: v1
kind: ConfigMap
metadata:
  name: lmstudio-upstream-config
  namespace: airgap-ai-stack
data:
  envoy.yaml: |
    static_resources:
      listeners:
        - name: lmstudio_upstream
          address:
            socket_address:
              address: 0.0.0.0
              port_value: 8080
          filter_chains:
            - filters:
                - name: envoy.filters.network.http_connection_manager
                  typed_config:
                    "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
                    stat_prefix: lmstudio_upstream
                    route_config:
                      name: lmstudio
                      virtual_hosts:
                        - name: lmstudio
                          domains: ["*"]
                          routes:
                            - match:
                                prefix: "/"
                              route:
                                cluster: lmstudio
                                timeout: 0s
                    access_log:
                      - name: envoy.access_loggers.stdout
                        typed_config:
                          "@type": type.googleapis.com/envoy.extensions.access_loggers.stream.v3.StdoutAccessLog
                          log_format:
                            json_format:
                              request_id: "%REQ(X-REQUEST-ID)%"
                              user_id: "%REQ(X-USER-ID)%"
                              method: "%REQ(:METHOD)%"
                              path: "%REQ(:PATH)%"
                    tracing:
                      provider:
                        name: envoy.tracers.opentelemetry
                        typed_config:
                          "@type": type.googleapis.com/envoy.config.trace.v3.OpenTelemetryConfig
                          service_name: lmstudio-upstream
                          grpc_service:
                            envoy_grpc:
                              cluster_name: otel-collector
                      custom_tags:
                        - tag: user.id
                          request_header:
                            name: X-User-Id
                    http_filters:
                      - name: envoy.filters.http.router
                        typed_config:
                          "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router
      clusters:
        - name: lmstudio
          connect_timeout: 5s
          type: STATIC
          load_assignment:
            cluster_name: lmstudio
            endpoints:
              - lb_endpoints:
                  - endpoint:
                      address:
                        socket_address:
                          address: 192.0.2.20
                          port_value: 1234
        - name: otel-collector
          connect_timeout: 2s
          type: STRICT_DNS
          http2_protocol_options: {}
          load_assignment:
            cluster_name: otel-collector
            endpoints:
              - lb_endpoints:
                  - endpoint:
                      address:
                        socket_address:
                          address: otel-collector.airgap-ai-stack.svc.cluster.local
                          port_value: 4317
    admin:
      access_log_path: /tmp/admin_access.log
      address:
        socket_address:
          address: 127.0.0.1
          port_value: 9901
---
apiVersion: v1
kind: Service
metadata:
  name: lmstudio-upstream
  namespace: airgap-ai-stack
spec:
  selector:
    app.kubernetes.io/name: lmstudio-upstream
  ports:
    - name: http
      port: 8080
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: lmstudio-upstream
  namespace: airgap-ai-stack
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: lmstudio-upstream
  template:
    metadata:
      labels:
        app.kubernetes.io/name: lmstudio-upstream
    spec:
      containers:
        - name: envoy
          image: envoyproxy/envoy:v1.36.0
          imagePullPolicy: IfNotPresent
          args: ["-c", "/etc/envoy/envoy.yaml"]
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /v1/models
              port: http
            initialDelaySeconds: 3
            periodSeconds: 5
          volumeMounts:
            - name: config
              mountPath: /etc/envoy
              readOnly: true
      volumes:
        - name: config
          configMap:
            name: lmstudio-upstream-config
---
# Envoy AI Gateway requires an Envoy Gateway Backend rather than a Service
# reference. The Backend resolves the local ClusterIP service above.
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: Backend
metadata:
  name: lmstudio-upstream
  namespace: airgap-ai-stack
spec:
  endpoints:
    - fqdn:
        hostname: lmstudio-upstream.airgap-ai-stack.svc.cluster.local
        port: 8080
---
# The AI Gateway is deliberately private: only pat-service reaches it through
# the edge Service with this internal Host header. The public api.ai.localhost
# route is served by pat-service, where each `sk-` token is checked and mapped
# to its Keycloak owner before the request reaches this route.
apiVersion: aigateway.envoyproxy.io/v1beta1
kind: AIGatewayRoute
metadata:
  name: lmstudio
  namespace: airgap-ai-stack
spec:
  parentRefs:
    - name: edge
      group: gateway.networking.k8s.io
      kind: Gateway
  hostnames:
    - aigw.ai.internal
  rules:
    - name: openai
      timeouts:
        request: 10m
      streamIdleTimeout: 10m
      backendRefs:
        - name: lmstudio-openai
---
# Validate the long-lived Keycloak service-account JWT injected by pat-service.
# X-User-Id is added only after a successful PAT lookup and is intentionally
# preserved to give each PAT owner an independent Envoy global-limit bucket.
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: SecurityPolicy
metadata:
  name: lmstudio-jwt
  namespace: airgap-ai-stack
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: lmstudio
  jwt:
    providers:
      - name: keycloak
        issuer: http://sso.ai.localhost:8080/sso/realms/ai-stack
        remoteJWKS:
          uri: http://keycloak.airgap-ai-stack.svc.cluster.local:8080/sso/realms/ai-stack/protocol/openid-connect/certs
---
# `Distinct` creates one shared, global rate-limit bucket for every PAT owner.
# Global rate limiting remains correct if the edge scales out.
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: BackendTrafficPolicy
metadata:
  name: lmstudio-per-user-limit
  namespace: airgap-ai-stack
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: lmstudio
  rateLimit:
    global:
      rules:
        - clientSelectors:
            - headers:
                - name: X-User-Id
                  type: Distinct
          limit:
            requests: 3
            unit: Minute
          xRateLimitHeaders: DraftVersion03
