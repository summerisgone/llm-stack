apiVersion: apps/v1
kind: Deployment
metadata:
  name: openwebui
  namespace: airgap-ai-stack
spec:
  template:
    spec:
      containers:
        - name: openwebui
          env:
            - name: OPENID_PROVIDER_URL
              value: http://keycloak.airgap-ai-stack.svc.cluster.local:8080/sso/realms/ai-stack/.well-known/openid-configuration
            - name: OPENID_REDIRECT_URI
              value: ***REMOVED***/oauth/oidc/callback
            # llm-d's fixed single-model endpoint is reliable for chat but
            # does not expose a model catalogue to Open WebUI's discovery
            # client. Declare the deployed models explicitly so the selector
            # remains available while requests still use the user's OAuth
            # token (system_oauth) configured by the base deployment.
            # qwen-3.8-27b is the single canonical model name both engines
            # serve (helm/airgap-stack/values.yaml inference.modelName) --
            # add/remove entries here in step with which backends are enabled.
            #
            # Index 1 is a second connection, reached through pat-service
            # rather than the private gateway directly -- the PAT below is
            # opaque, not a JWT, so it must go through pat-service's
            # swap-and-forward proxy, never straight to ai-gateway-private
            # (see docs/adr/0003, scripts/kc-pat-issue). It exists because
            # index 0 is system_oauth: Automations run with no browser
            # cookie to forward, so a scheduled run can never reach a model
            # through it (structural, confirmed live via the empty-reply /
            # knowledge_search-only signature). model_ids is left unset so
            # it discovers pat-service's catalogue dynamically, matching
            # what an admin adding this connection by hand in the UI gets --
            # ENABLE_PERSISTENT_CONFIG=false means that UI-added connection
            # only lives in the running pod's memory and is lost on the next
            # restart, so it has to be declared here to persist. prefix_id
            # must stay "automations" -- model presets (e.g.
            # hacker-news-model) reference "automations.<model>" as their
            # base_model_id.
            #
            # Index 2 is the user's personal Hermes agent behind
            # hermes-broker (docs/adr/0009, docs/operations/hermes.md).
            # system_oauth forwards the user's Keycloak access token, which
            # the broker verifies itself. model_ids is declared because the
            # broker answers /v1/models only with a user token.
            - name: OPENAI_API_CONFIGS
              value: '{"0":{"auth_type":"system_oauth","enable":true,"model_ids":["qwen-3.8-27b"]},"1":{"auth_type":"bearer","enable":true,"prefix_id":"automations"},"2":{"auth_type":"system_oauth","enable":true,"model_ids":["hermes-agent"]}}'
            - name: OPENAI_API_BASE_URLS
              value: http://ai-gateway-private.envoy-gateway-system.svc.cluster.local:8080/v1;http://pat-service.airgap-ai-stack.svc.cluster.local:8080/v1;http://hermes-broker.hermes-agents.svc.cluster.local:8080/v1
            # Issued for ***REMOVED*** specifically (not a shared service
            # account), so per-user rate limits and usage stay attributed
            # correctly. Index 0 has no static key (system_oauth), hence the
            # leading empty entry before the semicolon; index 2 (Hermes)
            # has none either, hence the trailing one.
            - name: OPENWEBUI_AUTOMATIONS_PAT
              valueFrom:
                secretKeyRef:
                  name: airgap-runtime
                  key: OPENWEBUI_AUTOMATIONS_PAT
            - name: OPENAI_API_KEYS
              value: ;$(OPENWEBUI_AUTOMATIONS_PAT);
            # Title, tag and follow-up generation go to the model, never to
            # a Hermes agent: each would be a full agent turn in the user's
            # sandbox.
            - name: TASK_MODEL_EXTERNAL
              value: qwen-3.8-27b
