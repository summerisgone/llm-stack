apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: airgap-ai-stack
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s
    scrape_configs:
      - job_name: prometheus
        static_configs:
          - targets: [prometheus:9090]
      - job_name: vllm-qwen38-nvfp4
        metrics_path: /metrics
        static_configs:
          - targets: [vllm-qwen38-nvfp4:8000]
            labels:
              namespace: airgap-ai-stack
      - job_name: sglang-qwen38
        metrics_path: /metrics
        static_configs:
          - targets: [sglang-qwen38:30000]
            labels:
              namespace: airgap-ai-stack
      - job_name: embeddings-bge-m3
        metrics_path: /metrics
        static_configs:
          - targets: [embeddings-bge-m3:80]
            labels:
              namespace: airgap-ai-stack
      - job_name: llmd-epp
        metrics_path: /metrics
        static_configs:
          - targets: [llmd-qwen-test-epp:9090]
            labels:
              namespace: airgap-ai-stack
      - job_name: pat-service
        metrics_path: /metrics
        static_configs:
          - targets: [pat-service:9090]
            labels:
              namespace: airgap-ai-stack
      - job_name: node
        static_configs:
          - targets: [node-exporter:9100]
            labels:
              namespace: airgap-ai-stack
      - job_name: gpu-exporter
        metrics_path: /metrics
        static_configs:
          - targets: [gpu-exporter:9400]
            labels:
              namespace: airgap-ai-stack
      - job_name: gpu-exporter-sglang
        metrics_path: /metrics
        static_configs:
          - targets: [gpu-exporter-sglang:9400]
            labels:
              namespace: airgap-ai-stack
