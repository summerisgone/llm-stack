apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: airgap-ai-stack
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s
    scrape_configs:
      # Engines and node-level exporters are found by pod discovery, not by
      # Service, so each pod is its own target and carries a `node` label
      # (ADR 0019). One job per workload keeps the job names dashboards use.
      - job_name: prometheus
        static_configs:
          - targets: [prometheus:9090]
      - job_name: vllm-qwen38-nvfp4
        metrics_path: /metrics
        kubernetes_sd_configs:
          - role: pod
            namespaces:
              names: [airgap-ai-stack]
        relabel_configs:
          - source_labels: [__meta_kubernetes_pod_label_app_kubernetes_io_name, __meta_kubernetes_pod_container_port_number]
            regex: vllm-qwen38-nvfp4;8000
            action: keep
          - source_labels: [__meta_kubernetes_namespace]
            target_label: namespace
          - source_labels: [__meta_kubernetes_pod_node_name]
            target_label: node
      - job_name: sglang-qwen38
        metrics_path: /metrics
        kubernetes_sd_configs:
          - role: pod
            namespaces:
              names: [airgap-ai-stack]
        relabel_configs:
          - source_labels: [__meta_kubernetes_pod_label_app_kubernetes_io_name, __meta_kubernetes_pod_container_port_number]
            regex: sglang-qwen38;8000
            action: keep
          - source_labels: [__meta_kubernetes_namespace]
            target_label: namespace
          - source_labels: [__meta_kubernetes_pod_node_name]
            target_label: node
      # ninfer pilot (docs/adr/0015). ninfer itself has no /metrics; this
      # scrapes the jsonl_exporter sidecar (helm/ninfer-inference) that tails
      # --request-log-jsonl instead. Naming the job "ninfer" gives
      # up{job="ninfer"} once this target is scraped successfully -- ADR-0015
      # Tier 2's stated minimum bar, satisfied by the same scrape as Tier 3,
      # no separate blackbox-exporter probe needed.
      - job_name: ninfer
        metrics_path: /metrics
        kubernetes_sd_configs:
          - role: pod
            namespaces:
              names: [airgap-ai-stack]
        relabel_configs:
          - source_labels: [__meta_kubernetes_pod_label_app_kubernetes_io_name, __meta_kubernetes_pod_container_port_number]
            regex: ninfer-qwen38;9400
            action: keep
          - source_labels: [__meta_kubernetes_namespace]
            target_label: namespace
          - source_labels: [__meta_kubernetes_pod_node_name]
            target_label: node
      # Strata (deploy/strata/README.md): its /metrics is JSON; this scrapes
      # the metrics-exporter sidecar (helm/strata-inference) on :9400.
      - job_name: strata
        metrics_path: /metrics
        kubernetes_sd_configs:
          - role: pod
            namespaces:
              names: [airgap-ai-stack]
        relabel_configs:
          - source_labels: [__meta_kubernetes_pod_label_app_kubernetes_io_name, __meta_kubernetes_pod_container_port_number]
            regex: strata-flash-next;9400
            action: keep
          - source_labels: [__meta_kubernetes_namespace]
            target_label: namespace
          - source_labels: [__meta_kubernetes_pod_node_name]
            target_label: node
      - job_name: embeddings-bge-m3
        metrics_path: /metrics
        kubernetes_sd_configs:
          - role: pod
            namespaces:
              names: [airgap-ai-stack]
        relabel_configs:
          - source_labels: [__meta_kubernetes_pod_label_app_kubernetes_io_name, __meta_kubernetes_pod_container_port_number]
            regex: embeddings-bge-m3;80
            action: keep
          - source_labels: [__meta_kubernetes_namespace]
            target_label: namespace
          - source_labels: [__meta_kubernetes_pod_node_name]
            target_label: node
      - job_name: llmd-epp
        metrics_path: /metrics
        static_configs:
          - targets: [llmd-qwen-test-epp:9090]
            labels:
              namespace: airgap-ai-stack
      - job_name: pat-service
        metrics_path: /metrics
        static_configs:
          - targets: [pat-service:9090]
            labels:
              namespace: airgap-ai-stack
      - job_name: node
        metrics_path: /metrics
        kubernetes_sd_configs:
          - role: pod
            namespaces:
              names: [airgap-ai-stack]
        relabel_configs:
          - source_labels: [__meta_kubernetes_pod_label_app_kubernetes_io_name, __meta_kubernetes_pod_container_port_number]
            regex: node-exporter;9100
            action: keep
          - source_labels: [__meta_kubernetes_namespace]
            target_label: namespace
          - source_labels: [__meta_kubernetes_pod_node_name]
            target_label: node
      - job_name: gpu-exporter
        metrics_path: /metrics
        kubernetes_sd_configs:
          - role: pod
            namespaces:
              names: [airgap-ai-stack]
        relabel_configs:
          - source_labels: [__meta_kubernetes_pod_label_app_kubernetes_io_name, __meta_kubernetes_pod_container_port_number]
            regex: gpu-exporter;9400
            action: keep
          - source_labels: [__meta_kubernetes_namespace]
            target_label: namespace
          - source_labels: [__meta_kubernetes_pod_node_name]
            target_label: node
