# Remote single-GPU profile (Windows + WSL2 + k3d, RTX 5090).
#
# Workloads only. Routing for this profile — the `edge` Gateway and its
# path-based external routes, the private `ai-gateway-private` Gateway, the
# llm-d Backend/AIServiceBackend/AIGatewayRoute and the JWT and per-user
# rate-limit policies — is owned by helm/airgap-stack/templates and is
# rendered from values, not from here. scripts/helm-render refuses to run if a
# routing object reappears in this render.
#
# `make helm-up` is the deploy path: it renders this overlay into the chart
# and applies the whole release. Applying this overlay with `kubectl apply -k`
# on its own deploys workloads without any Gateway and is only useful for
# `--dry-run` validation.
#
# The Keycloak realm ConfigMap is generated by the top-level
# k8s/kustomization.yaml and folded into the chart by scripts/helm-render.
namespace: airgap-ai-stack

resources:
  - ../../base
  - runtimeclass.yaml
  - model-volume.yaml
  - embeddings-model-volume.yaml
  - vllm.yaml
  - node-exporter.yaml
  - gpu-exporter.yaml

patches:
  - path: langfuse-public-url-patch.yaml
  - path: prometheus-config-patch.yaml
    target:
      version: v1
      kind: ConfigMap
      name: prometheus-config
  - path: openwebui-oidc-patch.yaml
    target:
      group: apps
      version: v1
      kind: Deployment
      name: openwebui
