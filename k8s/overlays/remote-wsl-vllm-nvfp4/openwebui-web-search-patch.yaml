# Web search in chat is the web-search MCP tool through pat-service
# (docs/adr/0017-web-search-mcp-openserp-kagent.md section 6), not Open
# WebUI's native provider. TOOL_SERVER_CONNECTIONS comes from the ConfigMap
# rendered by helm/airgap-stack (templates/openwebui-tool-servers.yaml, one
# entry per enabled MCP server, docs/adr/0018 section 7): while none is
# enabled the optional key leaves the variable unset and Open WebUI has no
# tool servers.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: openwebui
  namespace: airgap-ai-stack
spec:
  template:
    spec:
      containers:
        - name: openwebui
          env:
            - name: ENABLE_WEB_SEARCH
              value: "false"
            - name: TOOL_SERVER_CONNECTIONS
              valueFrom:
                configMapKeyRef:
                  name: openwebui-tool-servers
                  key: TOOL_SERVER_CONNECTIONS
                  optional: true
