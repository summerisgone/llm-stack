# MinIO is managed by the installed MinIO Operator. The tenant's `minio`
# service is used by Langfuse inside the namespace.
apiVersion: v1
kind: Secret
metadata:
  name: minio-configuration
  namespace: airgap-ai-stack
type: Opaque
stringData:
  config.env: |
    export MINIO_ROOT_USER="minio"
    export MINIO_ROOT_PASSWORD="minio-demo-only"
---
apiVersion: minio.min.io/v2
kind: Tenant
metadata:
  name: minio
  namespace: airgap-ai-stack
spec:
  # Pigsty-maintained MinIO build: upstream stopped publishing server images.
  image: docker.io/pgsty/minio:RELEASE.2026-08-04T00-00-00Z@sha256:b6bfe7239bfc83fb90d31612d9704d86039dd714f7904b3f1ad68f211e602372
  imagePullPolicy: IfNotPresent
  configuration:
    name: minio-configuration
  requestAutoCert: false
  buckets:
    - name: langfuse
      region: us-east-1
  pools:
    - name: pool-0
      servers: 1
      volumesPerServer: 1
      volumeClaimTemplate:
        apiVersion: v1
        kind: PersistentVolumeClaim
        spec:
          accessModes: [ReadWriteOnce]
          resources:
            requests:
              storage: 10Gi
