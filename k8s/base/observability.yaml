apiVersion: v1
kind: ConfigMap
metadata:
  name: otel-collector-config
  namespace: airgap-ai-stack
data:
  collector.yaml: |
    receivers:
      otlp:
        protocols:
          grpc:
            endpoint: 0.0.0.0:4317
          http:
            endpoint: 0.0.0.0:4318
    processors:
      memory_limiter:
        check_interval: 1s
        limit_mib: 256
        spike_limit_mib: 64
      filter/langfuse:
        error_mode: ignore
        traces:
          span:
            # Envoy transport spans contain no LLM input/output. Keep the
            # external processor's ai-gateway-genai observations instead.
            - 'resource.attributes["service.name"] == "ai-gateway-private"'
      batch:
    exporters:
      debug:
        verbosity: basic
      otlphttp/langfuse:
        # Langfuse accepts OTLP/HTTP at this endpoint. Authentication is
        # supplied by the Collector from the runtime Secret, never this ConfigMap.
        endpoint: http://langfuse:3000/api/public/otel
        auth:
          authenticator: basicauth/langfuse
        headers:
          x-langfuse-ingestion-version: "4"
    extensions:
      health_check:
        endpoint: 0.0.0.0:13133
      basicauth/langfuse:
        client_auth:
          username: ${env:LANGFUSE_PUBLIC_KEY}
          password: ${env:LANGFUSE_SECRET_KEY}
    service:
      extensions: [health_check, basicauth/langfuse]
      pipelines:
        traces:
          receivers: [otlp]
          processors: [memory_limiter, filter/langfuse, batch]
          exporters: [debug, otlphttp/langfuse]
        metrics:
          receivers: [otlp]
          exporters: [debug]
---
apiVersion: v1
kind: Service
metadata:
  name: otel-collector
  namespace: airgap-ai-stack
spec:
  selector:
    app.kubernetes.io/name: otel-collector
  ports:
    - name: otlp-grpc
      port: 4317
      targetPort: otlp-grpc
    - name: otlp-http
      port: 4318
      targetPort: otlp-http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: otel-collector
  namespace: airgap-ai-stack
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: otel-collector
  template:
    metadata:
      labels:
        app.kubernetes.io/name: otel-collector
    spec:
      containers:
        - name: otel-collector
          image: otel/opentelemetry-collector-contrib:0.114.0
          imagePullPolicy: IfNotPresent
          args: ["--config=/etc/otelcol-contrib/collector.yaml"]
          envFrom:
            - secretRef:
                name: airgap-runtime
          ports:
            - name: otlp-grpc
              containerPort: 4317
            - name: otlp-http
              containerPort: 4318
          readinessProbe:
            httpGet:
              path: /
              port: 13133
            initialDelaySeconds: 3
            periodSeconds: 5
          volumeMounts:
            - name: config
              mountPath: /etc/otelcol-contrib
              readOnly: true
      volumes:
        - name: config
          configMap:
            name: otel-collector-config
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: airgap-ai-stack
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s
    scrape_configs:
      - job_name: prometheus
        static_configs:
          - targets: [prometheus:9090]
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: prometheus-data
  namespace: airgap-ai-stack
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 10Gi
---
apiVersion: v1
kind: Service
metadata:
  name: prometheus
  namespace: airgap-ai-stack
spec:
  selector:
    app.kubernetes.io/name: prometheus
  ports:
    - name: http
      port: 9090
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prometheus
  namespace: airgap-ai-stack
spec:
  replicas: 1
  # Prometheus holds an exclusive lock on its TSDB PVC. A rolling update would
  # start a second pod against the same volume and crash-loop on that lock.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: prometheus
  template:
    metadata:
      labels:
        app.kubernetes.io/name: prometheus
    spec:
      containers:
        - name: prometheus
          image: prom/prometheus:v3.3.0
          imagePullPolicy: IfNotPresent
          args:
            - --config.file=/etc/prometheus/prometheus.yml
            - --storage.tsdb.path=/prometheus
          ports:
            - name: http
              containerPort: 9090
          readinessProbe:
            httpGet:
              path: /-/ready
              port: http
            initialDelaySeconds: 3
            periodSeconds: 5
          volumeMounts:
            - name: config
              mountPath: /etc/prometheus
              readOnly: true
            - name: data
              mountPath: /prometheus
      volumes:
        - name: config
          configMap:
            name: prometheus-config
        - name: data
          persistentVolumeClaim:
            claimName: prometheus-data
