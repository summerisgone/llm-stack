# The broker may manage agent Pods and create profile PVCs and agent-cred-*
# Secrets in this namespace only. It cannot delete PVCs: profiles are
# removed only by scripts/agent-profile-delete.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: agent-broker
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: agent-broker
rules:
  - apiGroups: [""]
    resources: [pods]
    verbs: [get, list, watch, create, delete, patch]
  - apiGroups: [""]
    resources: [persistentvolumeclaims]
    verbs: [get, list, create, patch]
  # RBAC cannot restrict `create` by name; the broker only ever creates
  # agent-cred-<id>.
  - apiGroups: [""]
    resources: [secrets]
    verbs: [get, create, update, patch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: agent-broker
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: agent-broker
subjects:
  - kind: ServiceAccount
    name: agent-broker
---
# pat-service issues a user's agent inference key from /platform
# (pat-service/cmd/pat-service/agents.go): it writes INFERENCE_KEY into
# agent-cred-<id> and deletes the user's agent pods (Hermes, pi, opencode)
# by label so the next start reads it.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: pat-service-agent-key
rules:
  - apiGroups: [""]
    resources: [secrets]
    verbs: [get, create, patch]
  - apiGroups: [""]
    resources: [pods]
    # delete: pat-service images before the label-selector delete.
    verbs: [delete, deletecollection]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: pat-service-agent-key
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: pat-service-agent-key
subjects:
  - kind: ServiceAccount
    name: pat-service
    namespace: airgap-ai-stack
