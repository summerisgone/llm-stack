apiVersion: v1
kind: Service
metadata:
  name: {{ .Values.name }}
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: {{ .Values.name }}
spec:
  selector:
    app.kubernetes.io/name: {{ .Values.name }}
  ports:
    - name: http
      port: 8000
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Values.name }}
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: {{ .Values.name }}
spec:
  replicas: {{ .Values.replicas }}
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ .Values.name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ .Values.name }}
        # EPP's core-metrics-extractor reads this to pick the engine's
        # metric names (queue, KV usage); the GAIE key is the fallback older
        # EPP builds read.
        llm-d.ai/engine-type: vllm
        inference.networking.k8s.io/engine-type: vllm
        # The model's InferencePool selects its pods by this label, whatever
        # the engine (ADR 0019); the NetworkPolicy in helm/airgap-stack
        # admits only EPP and Prometheus to them.
        llm-d.ai/model: {{ .Values.inference.servedModelName | quote }}
    spec:
      runtimeClassName: {{ .Values.runtimeClassName }}
      enableServiceLinks: false
      nodeSelector:
        {{- toYaml .Values.nodeSelector | nindent 8 }}
      tolerations:
        {{- toYaml .Values.tolerations | nindent 8 }}
      initContainers:
        # ADR 0019: fill this node's model cache from MinIO and verify it
        # against models/checksums.txt before the engine starts.
        - name: model-cache
          image: {{ .Values.modelCache.image | quote }}
          imagePullPolicy: IfNotPresent
          command: ["sh", "/scripts/model-cache-fill.sh", {{ .Values.modelCache.model | quote }}]
          env:
            - name: MINIO_URL
              value: {{ .Values.modelCache.minioURL | quote }}
          securityContext:
            # The hostPath cache directory is created root-owned.
            runAsUser: 0
          volumeMounts:
            - name: model
              mountPath: /cache
            - name: model-cache-scripts
              mountPath: /scripts
              readOnly: true
      containers:
        - name: vllm
          image: {{ .Values.image | quote }}
          imagePullPolicy: IfNotPresent
          args:
            - /model
            - --served-model-name
            - {{ .Values.inference.servedModelName | quote }}
            - --language-model-only
            - --dtype
            - auto
            - --kv-cache-dtype
            - {{ .Values.inference.kvCacheDtype | quote }}
            - --attention-backend
            - {{ .Values.inference.attentionBackend | quote }}
            - --max-model-len
            - {{ .Values.inference.maxModelLen | quote }}
            - --max-num-seqs
            - {{ .Values.inference.maxNumSeqs | quote }}
            - --max-num-batched-tokens
            - {{ .Values.inference.maxNumBatchedTokens | quote }}
            - --gpu-memory-utilization
            - {{ .Values.inference.gpuMemoryUtilization | quote }}
            - {{ ternary "--enable-prefix-caching" "--no-enable-prefix-caching" .Values.inference.prefixCaching }}
            - --mamba-cache-mode
            - {{ .Values.inference.mambaCacheMode | quote }}
            - --mamba-ssm-cache-dtype
            - {{ .Values.inference.mambaSsmCacheDtype | quote }}
            {{- with .Values.inference.speculativeConfig }}
            - --speculative-config
            - {{ . | toJson | quote }}
            {{- end }}
            {{- with .Values.inference.kvOffloadingSizeGiB }}
            - --kv-offloading-size
            - {{ . | quote }}
            - --kv-offloading-backend
            - {{ $.Values.inference.kvOffloadingBackend | quote }}
            {{- end }}
            - --reasoning-parser
            - qwen3
            - --enable-auto-tool-choice
            - --tool-call-parser
            - qwen3_coder
          env:
            - name: HF_HUB_OFFLINE
              value: "1"
            - name: TRANSFORMERS_OFFLINE
              value: "1"
            - name: VLLM_NO_USAGE_STATS
              value: "1"
            - name: NVIDIA_VISIBLE_DEVICES
              value: all
            - name: NVIDIA_DRIVER_CAPABILITIES
              value: compute,utility
            # Triton's registry subprocess consults this before ld.so.cache.
            # The legacy NVIDIA hook injects WSL2 libcuda at container start.
            - name: LD_LIBRARY_PATH
              value: /usr/lib/x86_64-linux-gnu:/usr/lib64:/usr/local/nvidia/lib:/usr/local/nvidia/lib64
          ports:
            - name: http
              containerPort: 8000
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 120
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 600
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: model
              mountPath: /model
              subPath: {{ .Values.modelCache.model }}
              readOnly: true
            - name: dshm
              mountPath: /dev/shm
      volumes:
        - name: model
          hostPath:
            path: {{ .Values.modelCache.hostPath }}
            type: DirectoryOrCreate
        - name: model-cache-scripts
          configMap:
            name: model-cache
        - name: dshm
          emptyDir:
            medium: Memory
            sizeLimit: {{ printf "%dGi" (.Values.inference.dshmSizeGiB | int) }}
