# The RuntimeClass and model PV/PVC are cluster prerequisites, kept outside Helm.
name: vllm-qwen38-nvfp4
image: llm-stack/vllm-qwen38-nvfp4:0.27.1
replicas: 1
runtimeClassName: nvidia
# ADR 0019: GPU pods go to any labelled, tainted inference worker, never to
# a named node.
nodeSelector:
  node-role/inference: "true"
tolerations:
  - key: nvidia.com/gpu
    operator: Exists
    effect: NoSchedule
# ADR 0019: weights come from MinIO bucket `models` into this node's cache
# (hostPath), filled and checked against models/checksums.txt by the
# model-cache initContainer before the engine starts. `model` is the name in
# models/manifest.yaml; the image is versions.lock.env MODEL_CACHE_IMAGE
# (rclone, sh, sha256sum).
modelCache:
  model: RadixArk-Qwen3.8-27B-NVFP4
  hostPath: /var/lib/llm-stack/models
  minioURL: http://minio.airgap-ai-stack.svc.cluster.local
  image: docker.io/rclone/rclone:1.71.1@sha256:d5971950c2b370fb04dd3292541b5bda6d9103143fd7e345aeb435a399388afc
inference:
  servedModelName: qwen-3.8-27b
  # GPUs per pod; keep resources' nvidia.com/gpu equal to it.
  tensorParallelSize: 1
  maxModelLen: 131072
  maxNumSeqs: 2
  maxNumBatchedTokens: 8192
  gpuMemoryUtilization: "0.94"
  kvCacheDtype: fp8
  attentionBackend: TRITON_ATTN
  prefixCaching: true
  mambaCacheMode: none
  mambaSsmCacheDtype: float32
  speculativeConfig: null
  kvOffloadingSizeGiB: 8
  kvOffloadingBackend: native
  # /dev/shm (dshm below) must exceed this: the native backend mmaps its
  # buffer at /dev/shm/vllm_offload_<engine_id>.mmap.
  dshmSizeGiB: 12
resources:
  requests:
    cpu: "4"
    memory: 12Gi
    nvidia.com/gpu: "1"
  limits:
    cpu: "8"
    memory: 20Gi
    nvidia.com/gpu: "1"
