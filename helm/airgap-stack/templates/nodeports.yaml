# NodePort is deliberately limited to the two operator-facing services. AIGW,
# databases, Keycloak and application backends remain ClusterIP-only.
apiVersion: v1
kind: Service
metadata:
  name: grafana-nodeport
  namespace: monitoring
spec:
  type: NodePort
  selector:
    app.kubernetes.io/instance: eg-addons
    app.kubernetes.io/name: grafana
  ports:
    - name: http
      port: 3000
      targetPort: 3000
      nodePort: {{ .Values.routing.nodePorts.grafana }}
---
apiVersion: v1
kind: Service
metadata:
  name: langfuse-nodeport
  namespace: {{ .Values.namespace }}
spec:
  type: NodePort
  selector:
    app.kubernetes.io/name: langfuse
    app.kubernetes.io/component: web
  ports:
    - name: http
      port: 3000
      targetPort: http
      nodePort: {{ .Values.routing.nodePorts.langfuse }}
