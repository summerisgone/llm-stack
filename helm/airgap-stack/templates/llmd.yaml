# Private llm-d inference path. Its Gateway is backed by a ClusterIP Service,
# so AIGW is unreachable from the Windows host and public proxy.
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: EnvoyProxy
metadata:
  name: ai-gateway-private
  namespace: {{ .Values.namespace }}
spec:
  telemetry:
    tracing:
      # The Collector authenticates to Langfuse with LANGFUSE_* credentials
      # from airgap-runtime; the AI Gateway never receives those credentials.
      samplingRate: 100
      provider:
        type: OpenTelemetry
        serviceName: ai-gateway-private
        backendRefs:
          - name: otel-collector
            port: 4317
      tags:
        # PAT requests are enriched by pat-service after SSO authentication.
        # Langfuse maps langfuse.user.id to its per-user trace view.
        "langfuse.user.id": "%REQUEST_HEADER(X-User-Name)%"
        "langfuse.trace.metadata.user_name": "%REQUEST_HEADER(X-User-Name)%"
        "langfuse.trace.metadata.user_subject": "%REQUEST_HEADER(X-User-Id)%"
        "langfuse.trace.metadata.pat_token_id": "%REQUEST_HEADER(X-Pat-Token-Id)%"
  provider:
    type: Kubernetes
    kubernetes:
      envoyDeployment:
        replicas: 1
      envoyService:
        name: ai-gateway-private
        type: ClusterIP
---
apiVersion: aigateway.envoyproxy.io/v1beta1
kind: GatewayConfig
metadata:
  name: ai-gateway-tracing
  namespace: {{ .Values.namespace }}
spec:
  extProc:
    kubernetes:
      env:
        - name: OTEL_EXPORTER_OTLP_ENDPOINT
          value: http://otel-collector.{{ .Values.namespace }}.svc.cluster.local:4317
        - name: OTEL_EXPORTER_OTLP_PROTOCOL
          value: grpc
        - name: OTEL_METRICS_EXPORTER
          value: none
        - name: OTEL_SERVICE_NAME
          value: ai-gateway-genai
        - name: OTEL_TRACES_SAMPLER
          value: always_on
        # Langfuse maps OpenInference input.value, output.value and
        # llm.model_name to the generation's standard analysis fields.
        - name: AI_GATEWAY_TRACING_SEMCONV
          value: openinference
        - name: OPENINFERENCE_HIDE_INPUTS
          value: "false"
        - name: OPENINFERENCE_HIDE_OUTPUTS
          value: "false"
---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: ai-gateway-private
  namespace: {{ .Values.namespace }}
  annotations:
    aigateway.envoyproxy.io/gateway-config: ai-gateway-tracing
spec:
  gatewayClassName: envoy
  infrastructure:
    parametersRef:
      group: gateway.envoyproxy.io
      kind: EnvoyProxy
      name: ai-gateway-private
  listeners:
    - name: private
      protocol: HTTP
      port: 8080
      allowedRoutes:
        namespaces:
          from: Same
---
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: Backend
metadata:
  name: llmd-qwen-test-proxy
  namespace: {{ .Values.namespace }}
spec:
  endpoints:
    - fqdn:
        hostname: llmd-qwen-test-epp.{{ .Values.namespace }}.svc.cluster.local
        port: 8081
---
apiVersion: aigateway.envoyproxy.io/v1beta1
kind: AIServiceBackend
metadata:
  name: llmd-qwen-test-openai
  namespace: {{ .Values.namespace }}
spec:
  backendRef:
    group: gateway.envoyproxy.io
    kind: Backend
    name: llmd-qwen-test-proxy
  schema:
    name: OpenAI
    prefix: /v1
---
# Pool members (every pod with llm-d.ai/model, any engine) take traffic only
# from the EPP pod, whose proxy sidecar forwards the requests EPP picked, and
# metrics scrapes from Prometheus. This replaces SGLang's upstream API key
# (ADR 0019); engines run without one. Enforced by k3s's kube-router policy
# controller, as for k8s/agents.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: inference-pool-members
  namespace: {{ .Values.namespace }}
spec:
  podSelector:
    matchExpressions:
      - key: llm-d.ai/model
        operator: Exists
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              llm-d-router-gateway: llmd-qwen-test-epp
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: prometheus
      ports:
        - port: 8000
          protocol: TCP
---
apiVersion: aigateway.envoyproxy.io/v1beta1
kind: AIGatewayRoute
metadata:
  name: llmd
  namespace: {{ .Values.namespace }}
spec:
  # Explicit empty list clears the hostname inherited from the previous
  # host-routed profile during Helm's strategic merge.
  hostnames: []
  parentRefs:
    - name: ai-gateway-private
      group: gateway.networking.k8s.io
      kind: Gateway
      sectionName: private
  rules:
    # Catch-all: any request whose model name isn't an exact match below
    # lands in the qwen-3.8-27b pool -- e.g. a client sending its own model
    # string instead of the canonical name.
    - name: openai
      timeouts:
        request: 10m
      streamIdleTimeout: 10m
      backendRefs:
        - name: llmd-qwen-test-openai
    # Declare the model to the EAG OpenAI model router under its canonical
    # name. EAG only advertises models in /v1/models that it sees in an
    # exact-match rule on the x-ai-eg-model header (the model parsed from the
    # request body). The name is a pool, not an engine (ADR 0019): it always
    # goes through llm-d EPP, which dispatches to every vLLM/SGLang pod
    # labelled llm-d.ai/model=<this name> (config/llmd/router-nvfp4-values.yaml).
    # A direct AIServiceBackend per engine would let traffic skip EPP's
    # queue and fair share (docs/adr/0008-per-user-fair-share.md).
    - name: openai-qwen38nvfp4
      matches:
        - headers:
            - type: Exact
              name: x-ai-eg-model
              value: {{ .Values.inference.modelName }}
      timeouts:
        request: 10m
      streamIdleTimeout: 10m
      backendRefs:
        - name: llmd-qwen-test-openai
    # Additional backends (llama.cpp, an external OpenAI-compatible
    # API): same route, one more exact-match rule per model name, each
    # pointing at the AIServiceBackend defined in inference-backends.yaml.
    # See docs/adr/0006-pluggable-inference-backends.md.
    {{- if .Values.inference.llamacpp.enabled }}
    - name: openai-llamacpp
      matches:
        - headers:
            - type: Exact
              name: x-ai-eg-model
              value: {{ .Values.inference.llamacpp.modelName }}
      timeouts:
        request: 10m
      streamIdleTimeout: 10m
      backendRefs:
        - name: llamacpp-openai
    {{- end }}
    {{- if .Values.inference.externalApi.enabled }}
    - name: openai-external-api
      matches:
        - headers:
            - type: Exact
              name: x-ai-eg-model
              value: {{ .Values.inference.externalApi.modelName }}
      timeouts:
        request: 10m
      streamIdleTimeout: 10m
      backendRefs:
        - name: external-api-openai
    {{- end }}
    # ninfer cannot join EPP (ADR 0015), so it is its own model name on a
    # direct route (ADR 0019), with no EPP queue or fair share. It shares the
    # GPU with the pool: on one GPU it answers only while the vLLM/SGLang
    # replicas are 0.
    {{- if .Values.inference.ninfer.enabled }}
    - name: openai-ninfer
      matches:
        - headers:
            - type: Exact
              name: x-ai-eg-model
              value: {{ .Values.inference.ninfer.modelName }}
      timeouts:
        request: 10m
      streamIdleTimeout: 10m
      backendRefs:
        - name: ninfer-openai
    {{- end }}
---
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: SecurityPolicy
metadata:
  name: llmd-jwt
  namespace: {{ .Values.namespace }}
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: llmd
  jwt:
    providers:
      - name: keycloak
        issuer: {{ .Values.oidc.externalIssuer }}
        remoteJWKS:
          uri: http://keycloak.{{ .Values.namespace }}.svc.cluster.local:8080/sso/realms/ai-stack/protocol/openid-connect/certs
---
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: BackendTrafficPolicy
metadata:
  name: llmd-per-user-limit
  namespace: {{ .Values.namespace }}
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: llmd
  # The AI Gateway ext-proc buffers the whole request body to read the model
  # name and count tokens, and rejects anything over its own default buffer
  # size (empirically ~32KiB) with 413 request_payload_too_large before the
  # request ever reaches SGLang or vLLM. 4Mi covers a full-context request at
  # either engine's configured --context-length/--max-model-len with room to
  # spare (155648 tokens is at most ~700KiB of UTF-8 text).
  requestBuffer:
    limit: 4Mi
  rateLimit:
    global:
      rules:
        - clientSelectors:
            - headers:
                - name: X-User-Id
                  type: Distinct
          limit:
            requests: {{ .Values.inference.perUserRateLimitPerMinute }}
            unit: Minute
          xRateLimitHeaders: DraftVersion03
