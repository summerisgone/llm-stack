# Public Envoy Gateway. Browser services are routed by path only, so the
# Windows host name is never an application endpoint or routing selector.
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: EnvoyProxy
metadata:
  name: edge
  namespace: {{ .Values.namespace }}
spec:
  provider:
    type: Kubernetes
    kubernetes:
      envoyDeployment:
        replicas: 1
      envoyService:
        name: airgap-ai-edge
        type: LoadBalancer
        externalTrafficPolicy: Local
---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: edge
  namespace: {{ .Values.namespace }}
spec:
  gatewayClassName: envoy
  infrastructure:
    parametersRef:
      group: gateway.envoyproxy.io
      kind: EnvoyProxy
      name: edge
  listeners:
    - name: external
      protocol: HTTP
      port: {{ .Values.routing.edge.externalPort }}
      allowedRoutes:
        namespaces:
          from: Same
---
# ADR 0004: the site proxy terminates TLS and is the one hop in front of the
# external listener. Trusting it makes Envoy keep the proxy's
# X-Forwarded-Proto (https) instead of overwriting it with the plaintext
# scheme, and take the client IP from its X-Forwarded-For. Envoy's own OIDC
# (dsh-web, repowise) builds its post-login redirect from that scheme; with
# http there the browser comes back without the session cookies and loops.
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: ClientTrafficPolicy
metadata:
  name: edge-external-site-proxy
  namespace: {{ .Values.namespace }}
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: edge
      sectionName: external
  clientIPDetection:
    xForwardedFor:
      numTrustedHops: 1
