          "secret": "openwebui-demo-secret",
          "standardFlowEnabled": true,
          "directAccessGrantsEnabled": false,
          "redirectUris": ["***REMOVED***/*"],
          "webOrigins": ["***REMOVED***"],
          "attributes": {
            "post.logout.redirect.uris": "***REMOVED***/auth"
          },
          "defaultClientScopes": ["basic", "profile", "email", "roles", "groups"],
          "optionalClientScopes": ["offline_access"]
        },
        {
          "clientId": "llm-api",
          "name": "LLM API",
          "enabled": true,
          "protocol": "openid-connect",
          "publicClient": true,
          "standardFlowEnabled": true,
          "directAccessGrantsEnabled": true,
          "redirectUris": ["http://localhost/*"],
          "webOrigins": ["http://localhost"],
          "defaultClientScopes": ["basic", "profile", "email", "roles", "groups"]
        },
        {
          "clientId": "pat-dashboard",
          "name": "Personal access token dashboard",
          "enabled": true,
          "protocol": "openid-connect",
          "publicClient": true,
          "standardFlowEnabled": true,
          "directAccessGrantsEnabled": false,
          "redirectUris": ["***REMOVED***/platform/auth/callback"],
          "webOrigins": ["***REMOVED***"],
          "defaultClientScopes": ["basic", "profile", "email", "roles", "groups"]
        },
        {
          "clientId": "pat-gateway",
          "name": "PAT service to Envoy AI Gateway",
          "enabled": true,
          "protocol": "openid-connect",
