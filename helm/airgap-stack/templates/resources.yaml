            drop:
            - ALL
          readOnlyRootFilesystem: true
        volumeMounts:
        - mountPath: /etc/pat-service
          name: pricing
          readOnly: true
      serviceAccountName: pat-service
      volumes:
      - configMap:
          name: pat-service-pricing
        name: pricing
