          "emailVerified": true,
          "firstName": "Admin",
          "lastName": "User",
          "email": "admin@ai.local",
          "groups": ["/demo-users"],
          "realmRoles": ["ai-user", "ai-admin"],
          "credentials": [{ "type": "password", "value": "admin-demo-only", "temporary": false }]
        }
      ]
    }
