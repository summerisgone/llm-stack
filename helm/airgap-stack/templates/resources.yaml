  realm-demo.json: |
    {
      "realm": "ai-stack",
      "enabled": true,
      "displayName": "AI Stack Demo",
      "registrationAllowed": false,
      "sslRequired": "all",
      "passwordPolicy": "length(12) and upperCase(1) and lowerCase(1) and digits(1) and specialChars(1)",
      "bruteForceProtected": true,
      "failureFactor": 5,
      "waitIncrementSeconds": 60,
      "maxFailureWaitSeconds": 900,
      "minimumQuickLoginWaitSeconds": 60,
      "quickLoginCheckMilliSeconds": 1000,
      "maxDeltaTimeSeconds": 43200,
      "requiredActions": [
        {
          "alias": "CONFIGURE_TOTP",
          "name": "Configure OTP",
          "providerId": "CONFIGURE_TOTP",
          "enabled": true,
          "defaultAction": true,
          "priority": 10,
          "config": {}
        }
      ],
      "roles": {
        "realm": [
          { "name": "ai-user", "description": "May use AI applications" },
          { "name": "ai-admin", "description": "Administers the AI stack" },
          { "name": "observability-viewer", "description": "May view telemetry" }
        ]
      },
      "groups": [
        { "name": "demo-users", "attributes": { "tenant_id": ["demo"], "qos_class": ["interactive"] } }
      ],
      "clients": [
        {
          "clientId": "open-webui",
          "name": "Open WebUI",
          "enabled": true,
          "protocol": "openid-connect",
