        - name: PAT_HASH_KEY
          valueFrom:
            secretKeyRef:
              key: PAT_HASH_KEY
              name: airgap-runtime
        - name: PAT_COOKIE_KEY
          valueFrom:
            secretKeyRef:
              key: PAT_COOKIE_KEY
              name: airgap-runtime
        - name: AI_GATEWAY_CLIENT_SECRET
          valueFrom:
            secretKeyRef:
              key: PAT_GATEWAY_CLIENT_SECRET
              name: airgap-runtime
        - name: OIDC_ISSUER
          value: ***REMOVED***/sso/realms/ai-stack
        - name: OIDC_INTERNAL_ISSUER
          value: http://keycloak.airgap-ai-stack.svc.cluster.local:8080/sso/realms/ai-stack
        - name: OIDC_CLIENT_ID
          value: pat-dashboard
        - name: OIDC_REDIRECT_URL
          value: ***REMOVED***/platform/auth/callback
        - name: AI_GATEWAY_URL
          value: http://ai-gateway-private.envoy-gateway-system.svc.cluster.local:8080
        - name: AI_GATEWAY_CLIENT_ID
          value: pat-gateway
        - name: URL_PREFIX
          value: /platform
        - name: WEBUI_URL
          value: ***REMOVED***
        - name: QOS_LOG_CLIENT_SHAPE
          value: "false"
        - name: VALKEY_ADDR
          value: envoy-ratelimit-valkey.airgap-ai-stack.svc.cluster.local:6379
        - name: QOS_SESSION_TTL_SECONDS
          value: "1800"
        - name: QOS_FINGERPRINT_MAX_BODY_BYTES
          value: "4194304"
        - name: QOS_FINGERPRINT_TIMEOUT_MS
          value: "200"
        - name: QOS_PRICING_FILE
          value: /etc/pat-service/pricing.json
        - name: QOS_MONTHLY_LIMIT
          value: "0"
        - name: WEB_SEARCH_ENABLED
          valueFrom:
            secretKeyRef:
              key: WEB_SEARCH_ENABLED
              name: airgap-runtime
              optional: true
        - name: REPOWISE_ENABLED
          valueFrom:
            secretKeyRef:
              key: REPOWISE_ENABLED
              name: airgap-runtime
              optional: true
        - name: MCP_CALLS_PER_MINUTE
          value: "30"
        image: ghcr.io/summerisgone/pat-service:latest
        imagePullPolicy: Always
        name: pat-service
        ports:
        - containerPort: 8080
          name: http
        - containerPort: 9090
          name: metrics
        readinessProbe:
          httpGet:
            path: /healthz
            port: http
          initialDelaySeconds: 5
          periodSeconds: 5
        securityContext:
          allowPrivilegeEscalation: false
