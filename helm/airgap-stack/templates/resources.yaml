          "secret": "pat-gateway-demo-only",
          "serviceAccountsEnabled": true,
          "standardFlowEnabled": false,
          "directAccessGrantsEnabled": false,
          "attributes": { "access.token.lifespan": "315360000" },
          "defaultClientScopes": ["basic"]
        },
        {
          "clientId": "grafana",
          "name": "Grafana",
          "enabled": true,
          "protocol": "openid-connect",
          "publicClient": false,
          "secret": "grafana-oauth-demo-only",
