          "directAccessGrantsEnabled": false,
          "redirectUris": ["http://grafana.localhost:8080/login/generic_oauth"],
          "webOrigins": ["http://grafana.localhost:8080"],
          "defaultClientScopes": ["basic", "profile", "email", "roles", "groups"]
