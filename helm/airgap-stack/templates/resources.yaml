apiVersion: apps/v1
kind: Deployment
metadata:
  name: openwebui
  namespace: airgap-ai-stack
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: openwebui
  template:
    metadata:
      labels:
        app.kubernetes.io/name: openwebui
    spec:
      containers:
      - env:
        - name: ENABLE_WEB_SEARCH
          value: "false"
        - name: TOOL_SERVER_CONNECTIONS
          valueFrom:
            configMapKeyRef:
              key: TOOL_SERVER_CONNECTIONS
              name: openwebui-tool-servers
              optional: true
        - name: OPENID_PROVIDER_URL
          value: http://keycloak.airgap-ai-stack.svc.cluster.local:8080/sso/realms/ai-stack/.well-known/openid-configuration
        - name: OPENID_REDIRECT_URI
          value: ***REMOVED***/oauth/oidc/callback
        - name: OPENAI_API_CONFIGS
          value: '{"0":{"auth_type":"system_oauth","enable":true,"model_ids":["qwen-3.8-27b"]},"1":{"auth_type":"bearer","enable":true,"prefix_id":"automations"},"2":{"auth_type":"system_oauth","enable":true,"model_ids":["hermes-agent"]}}'
        - name: OPENAI_API_BASE_URLS
          value: http://ai-gateway-private.envoy-gateway-system.svc.cluster.local:8080/v1;http://pat-service.airgap-ai-stack.svc.cluster.local:8080/v1;http://hermes-broker.hermes-agents.svc.cluster.local:8080/v1
        - name: OPENWEBUI_AUTOMATIONS_PAT
          valueFrom:
            secretKeyRef:
              key: OPENWEBUI_AUTOMATIONS_PAT
              name: airgap-runtime
        - name: OPENAI_API_KEYS
          value: ;$(OPENWEBUI_AUTOMATIONS_PAT);
        - name: TASK_MODEL_EXTERNAL
          value: qwen-3.8-27b
        - name: WEBUI_SECRET_KEY
          valueFrom:
            secretKeyRef:
              key: WEBUI_SECRET_KEY
              name: airgap-runtime
        - name: WEBUI_URL
          value: ***REMOVED***
        - name: ENABLE_PERSISTENT_CONFIG
          value: "false"
        - name: ENABLE_SIGNUP
          value: "false"
        - name: ENABLE_OAUTH_SIGNUP
          value: "true"
        - name: ENABLE_LOGIN_FORM
          value: "false"
        - name: ENABLE_PASSWORD_AUTH
          value: "false"
        - name: DEFAULT_USER_ROLE
          value: pending
        - name: USER_PERMISSIONS_WORKSPACE_MODELS_ACCESS
          value: "true"
        - name: USER_PERMISSIONS_WORKSPACE_KNOWLEDGE_ACCESS
          value: "true"
        - name: USER_PERMISSIONS_WORKSPACE_PROMPTS_ACCESS
          value: "true"
        - name: USER_PERMISSIONS_WORKSPACE_TOOLS_ACCESS
          value: "true"
        - name: USER_PERMISSIONS_WORKSPACE_SKILLS_ACCESS
          value: "true"
        - name: USER_PERMISSIONS_FEATURES_WEB_SEARCH
          value: "true"
        - name: USER_PERMISSIONS_FEATURES_API_KEYS
          value: "true"
        - name: ENABLE_API_KEYS
          value: "true"
        - name: USER_PERMISSIONS_FEATURES_AUTOMATIONS
          value: "true"
        - name: OAUTH_MERGE_ACCOUNTS_BY_EMAIL
          value: "true"
        - name: OAUTH_CLIENT_ID
          value: open-webui
        - name: OAUTH_CLIENT_SECRET
          value: openwebui-demo-secret
        - name: OAUTH_PROVIDER_NAME
          value: Keycloak
        - name: OAUTH_SCOPES
          value: openid profile email offline_access
        - name: OAUTH_ROLES_CLAIM
          value: realm_access.roles
        - name: ENABLE_OAUTH_ROLE_MANAGEMENT
          value: "true"
        - name: OAUTH_ALLOWED_ROLES
          value: ai-user,ai-admin
        - name: OAUTH_ADMIN_ROLES
          value: ai-admin
        - name: OPENAI_API_BASE_URL
          value: http://ai-gateway-private.envoy-gateway-system.svc.cluster.local:8080/v1
        - name: ENABLE_FORWARD_USER_INFO_HEADERS
          value: "true"
        - name: FORWARD_USER_INFO_HEADER_USER_NAME
          value: X-User-Name
        - name: FORWARD_USER_INFO_HEADER_USER_ID
          value: X-User-Id
        - name: BYPASS_MODEL_ACCESS_CONTROL
          value: "true"
        image: ghcr.io/open-webui/open-webui:v0.11.4
        imagePullPolicy: IfNotPresent
        name: openwebui
        ports:
        - containerPort: 8080
          name: http
        readinessProbe:
          httpGet:
            path: /health
            port: http
          initialDelaySeconds: 10
          periodSeconds: 10
        volumeMounts:
        - mountPath: /app/backend/data
          name: data
      initContainers:
      - command:
        - /bin/sh
        - -ec
        - |
          cd /app/backend/open_webui
          export WEBUI_SECRET_KEY=bootstrap-only-not-used-by-the-application
          alembic -c alembic.ini upgrade head
          python3 - <<'PY'
          import sqlite3
          import time

          database = '/app/backend/data/webui.db'
          bootstrap_id = '00000000-0000-0000-0000-000000000001'
          bootstrap_email = 'openwebui-sso-bootstrap@invalid.local'
          now = int(time.time())

          with sqlite3.connect(database) as connection:
              connection.execute(
                  'INSERT OR IGNORE INTO "user" '
                  '(id, name, email, role, profile_image_url, last_active_at, '
                  'updated_at, created_at, oauth, info, settings) '
                  'VALUES (?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?)',
                  (
                      bootstrap_id,
                      'SSO role bootstrap (system)',
                      bootstrap_email,
                      'pending',
                      '/user.png',
                      0,
                      now,
                      now,
                      '{}',
                      '{}',
                      '{}',
                  ),
              )
          PY
        image: ghcr.io/open-webui/open-webui:v0.11.4
        imagePullPolicy: IfNotPresent
        name: sso-role-bootstrap
        volumeMounts:
        - mountPath: /app/backend/data
          name: data
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: openwebui-data
