# Optional inference backends that bypass llm-d entirely -- direct
# AIServiceBackend, no EPP queue or fair-share. Disabled
# (.Values.inference.*.enabled=false) until an operator has the engine
# actually running and reachable at the configured host/port -- see
# deploy/llamacpp, or an external OpenAI-compatible endpoint. The matching
# AIGatewayRoute rules live in llmd.yaml, next to the vLLM rule they extend.
# See docs/adr/0006-pluggable-inference-backends.md.
#
# vLLM and SGLang are deliberately not here: they are members of the
# `qwen-3.8-27b` pool behind llm-d EPP (llmd.yaml, ADR 0019), so their
# traffic never skips fair-share queueing.
{{- if .Values.inference.llamacpp.enabled }}
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: Backend
metadata:
  name: llamacpp
  namespace: {{ .Values.namespace }}
spec:
  endpoints:
    - fqdn:
        hostname: {{ .Values.inference.llamacpp.host }}
        port: {{ .Values.inference.llamacpp.port }}
---
apiVersion: aigateway.envoyproxy.io/v1beta1
kind: AIServiceBackend
metadata:
  name: llamacpp-openai
  namespace: {{ .Values.namespace }}
spec:
  backendRef:
    group: gateway.envoyproxy.io
    kind: Backend
    name: llamacpp
  schema:
    name: OpenAI
    prefix: /v1
{{- end }}
---
{{- if .Values.inference.externalApi.enabled }}
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: Backend
metadata:
  name: external-api
  namespace: {{ .Values.namespace }}
spec:
  endpoints:
    - fqdn:
        hostname: {{ .Values.inference.externalApi.host }}
        port: {{ .Values.inference.externalApi.port }}
---
apiVersion: aigateway.envoyproxy.io/v1beta1
kind: AIServiceBackend
metadata:
  name: external-api-openai
  namespace: {{ .Values.namespace }}
spec:
  backendRef:
    group: gateway.envoyproxy.io
    kind: Backend
    name: external-api
  schema:
    name: OpenAI
    prefix: /v1
{{- if .Values.runtimeEnvironment.EXTERNAL_API_KEY }}
---
apiVersion: v1
kind: Secret
metadata:
  name: external-api-key
  namespace: {{ .Values.namespace }}
type: Opaque
stringData:
  apiKey: {{ .Values.runtimeEnvironment.EXTERNAL_API_KEY | quote }}
---
apiVersion: aigateway.envoyproxy.io/v1beta1
kind: BackendSecurityPolicy
metadata:
  name: external-api-key
  namespace: {{ .Values.namespace }}
spec:
  type: APIKey
  apiKey:
    secretRef:
      name: external-api-key
  targetRefs:
    - group: aigateway.envoyproxy.io
      kind: AIServiceBackend
      name: external-api-openai
{{- end }}
{{- end }}
---
# ninfer pilot (docs/adr/0015-third-party-engine-metrics-contract.md,
# ~/agent/ninfer-pilot-task.md). Direct backend like llamacpp/externalApi
# above, but ninfer runs as an in-cluster Deployment (helm/ninfer-inference,
# make ninfer-up) requesting its own nvidia.com/gpu: "1" -- unlike llamacpp's
# host-run container, its host/port is a k8s Service DNS name, not
# host.k3d.internal. It cannot join llm-d EPP (see ADR-0015 Instructions
# §6), so like llamacpp/externalApi it is its own model name
# (inference.ninfer.modelName) with its own rule in llmd.yaml (ADR 0019).
{{- if .Values.inference.ninfer.enabled }}
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: Backend
metadata:
  name: ninfer
  namespace: {{ .Values.namespace }}
spec:
  endpoints:
    - fqdn:
        hostname: {{ .Values.inference.ninfer.host }}
        port: {{ .Values.inference.ninfer.port }}
---
apiVersion: aigateway.envoyproxy.io/v1beta1
kind: AIServiceBackend
metadata:
  name: ninfer-openai
  namespace: {{ .Values.namespace }}
spec:
  backendRef:
    group: gateway.envoyproxy.io
    kind: Backend
    name: ninfer
  schema:
    name: OpenAI
    prefix: /v1
{{- if .Values.runtimeEnvironment.NINFER_API_KEY }}
---
# ninfer-serve enforces --api-key; unlike llamacpp (no
# auth), the gateway must inject it on the way to ninfer's own AIServiceBackend.
# Same secret name the ninfer-inference chart's apiKeySecret value expects,
# so both the inbound (server --api-key) and outbound (gateway Authorization
# header) sides read one value.
apiVersion: v1
kind: Secret
metadata:
  name: ninfer-api-key
  namespace: {{ .Values.namespace }}
type: Opaque
stringData:
  apiKey: {{ .Values.runtimeEnvironment.NINFER_API_KEY | quote }}
---
apiVersion: aigateway.envoyproxy.io/v1beta1
kind: BackendSecurityPolicy
metadata:
  name: ninfer-api-key
  namespace: {{ .Values.namespace }}
spec:
  type: APIKey
  apiKey:
    secretRef:
      name: ninfer-api-key
  targetRefs:
    - group: aigateway.envoyproxy.io
      kind: AIServiceBackend
      name: ninfer-openai
{{- end }}
{{- end }}
---
# Strata (deploy/strata/README.md): an in-cluster Deployment
# (helm/strata-inference, make strata-up) under its own model name
# (inference.strata.modelName), the same shape as ninfer above.
{{- if .Values.inference.strata.enabled }}
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: Backend
metadata:
  name: strata
  namespace: {{ .Values.namespace }}
spec:
  endpoints:
    - fqdn:
        hostname: {{ .Values.inference.strata.host }}
        port: {{ .Values.inference.strata.port }}
---
apiVersion: aigateway.envoyproxy.io/v1beta1
kind: AIServiceBackend
metadata:
  name: strata-openai
  namespace: {{ .Values.namespace }}
spec:
  backendRef:
    group: gateway.envoyproxy.io
    kind: Backend
    name: strata
  schema:
    name: OpenAI
    prefix: /v1
{{- if .Values.runtimeEnvironment.STRATA_API_KEY }}
---
# serve/server.py enforces --api-key (STRATA_API_KEY); the gateway injects
# the same value. The strata-inference chart's apiKeySecret reads it too.
apiVersion: v1
kind: Secret
metadata:
  name: strata-api-key
  namespace: {{ .Values.namespace }}
type: Opaque
stringData:
  apiKey: {{ .Values.runtimeEnvironment.STRATA_API_KEY | quote }}
---
apiVersion: aigateway.envoyproxy.io/v1beta1
kind: BackendSecurityPolicy
metadata:
  name: strata-api-key
  namespace: {{ .Values.namespace }}
spec:
  type: APIKey
  apiKey:
    secretRef:
      name: strata-api-key
  targetRefs:
    - group: aigateway.envoyproxy.io
      kind: AIServiceBackend
      name: strata-openai
{{- end }}
{{- end }}
---
# bge-m3 embeddings (docs/adr/0013-embeddings-api-bge-m3.md). Direct backend
# like llamacpp/externalApi above, but its AIGatewayRoute is a separate
# object (templates/embeddings.yaml), not a rule inside `llmd` -- see that
# file for why.
{{- if .Values.inference.embeddings.enabled }}
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: Backend
metadata:
  name: embeddings
  namespace: {{ .Values.namespace }}
spec:
  endpoints:
    - fqdn:
        hostname: {{ .Values.inference.embeddings.host }}
        port: {{ .Values.inference.embeddings.port }}
---
apiVersion: aigateway.envoyproxy.io/v1beta1
kind: AIServiceBackend
metadata:
  name: embeddings-openai
  namespace: {{ .Values.namespace }}
spec:
  backendRef:
    group: gateway.envoyproxy.io
    kind: Backend
    name: embeddings
  schema:
    name: OpenAI
    prefix: /v1
{{- end }}
