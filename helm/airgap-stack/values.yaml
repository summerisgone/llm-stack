# Chart-level values for the air-gapped stack wrapper.
#
# The namespace must match what the kustomize sources embed in each object's
# metadata (airgap-ai-stack). It is also the install namespace of the release.
namespace: airgap-ai-stack

# Environment exposed to every workload through the airgap-runtime Secret
# via envFrom. These are the demo defaults from .env.example. helm-stack-up
# layers the real .env over them as a values overlay so .env stays the source
# of truth; override any key directly here or through --set.
runtimeEnvironment:
  LANGFUSE_PUBLIC_KEY: lf_pk_ai_stack_local_demo_only
  LANGFUSE_SECRET_KEY: lf_sk_ai_stack_local_demo_only
  LANGFUSE_HOST: http://langfuse:3000
  LANGFUSE_INIT_ORG_ID: ai-stack
  LANGFUSE_INIT_ORG_NAME: AI Stack
  LANGFUSE_INIT_PROJECT_ID: local-ai-stack
  LANGFUSE_INIT_PROJECT_NAME: Local AI Stack
  LANGFUSE_INIT_USER_EMAIL: admin@langfuse.localhost
  LANGFUSE_INIT_USER_NAME: AI Stack Admin
  LANGFUSE_INIT_USER_PASSWORD: langfuse-admin-demo-only
  PAT_HASH_KEY: replace-this-with-a-unique-32-byte-minimum-pat-hash-key
  PAT_COOKIE_KEY: replace-this-with-a-unique-32-byte-minimum-cookie-signing-key
  PAT_GATEWAY_CLIENT_SECRET: pat-gateway-demo-only
  PAT_DIRECTORY_CLIENT_SECRET: pat-directory-demo-only
  WEBUI_SECRET_KEY: replace-this-with-a-unique-openwebui-session-encryption-key
  # Upstream bearer tokens for optional inference backends (see `inference`
  # below). Empty means "no Authorization header is injected"; only set one
  # if that backend actually requires it. Never real values in this file --
  # override through .env like every other runtime secret.
  EXTERNAL_API_KEY: ""

# --- Inference backends -------------------------------------------------------
# vLLM behind llm-d (templates/llmd.yaml, catch-all + the "qwen38-nvfp4"
# model rule) is the always-on default. Everything here is an additional,
# independently-toggled AI Gateway rule keyed on model name -- see
# docs/adr/0006-pluggable-inference-backends.md. Each engine is started and
# stopped outside Kubernetes (host Docker containers, or an external
# service); flipping `enabled` only tells the gateway the endpoint now
# exists, it does not start anything.
inference:
  # Single canonical model name advertised in the OpenAI API, identical
  # whichever engine (vLLM or SGLang) is actually serving -- clients keep
  # sending `model: qwen-3.8-27b` unchanged across engine switches.
  # Must match each engine chart's `inference.servedModelName`.
  modelName: qwen-3.8-27b
  # Engine-neutral model name: always the engine that currently serves, so
  # clients keep it across switches between the pool, ninfer and Strata. The
  # gateway rewrites it to that engine's own model name (modelNameOverride),
  # and the catch-all rule (any unknown name) follows it too. engine is one
  # of pool (vLLM/SGLang through EPP), ninfer, strata, externalApi,
  # llamacpp; helm-up sets it from DEFAULT_ENGINE (Makefile), derived from
  # the engine replicas in .env.
  defaultModel:
    modelName: default
    engine: pool
  # Per-user storm guard on the inference route (llmd-per-user-limit
  # BackendTrafficPolicy) -- frequency, not concurrency; admission is the
  # llm-d EPP flow control (utilization-detector, ADR 0012), not this
  # limit. 3/min was a temporary value set to keep Stage 0's
  # baseline measurements from tripping it before the interesting
  # concurrency behaviour was even observable
  # (TASK-qos-fair-share.md Stage 0.6); raised now that Stage 3's
  # observation-mode session tracking needs real, unthrottled coding-agent
  # traffic to validate against (§4.5: "заменить высоким потолком против
  # шторма, порядка 60/мин").
  perUserRateLimitPerMinute: 60
  # llama.cpp's server (deploy/llamacpp). No profile is wired up until a
  # checksummed GGUF model is in place; see config/llamacpp.
  llamacpp:
    enabled: false
    host: host.k3d.internal
    port: 8090
    modelName: llamacpp-local
  # Any other OpenAI-compatible endpoint: LM Studio on the LAN (the
  # local-mac profile's default), Ollama, a hosted API. Plain HTTP only --
  # routing a public HTTPS endpoint needs a BackendTLSPolicy this chart does
  # not define. Setting enabled without a host is a configuration error.
  #
  # Used for Strata run on the GPU host (deploy/strata/README.md): the
  # container from deploy/strata/run, model qwen-3.8-flash-next. Its key is
  # EXTERNAL_API_KEY in .env, the same value the container gets as
  # STRATA_API_KEY.
  externalApi:
    enabled: true
    host: host.k3d.internal
    port: 8095
    modelName: qwen-3.8-flash-next
  # ninfer pilot (docs/adr/0015-third-party-engine-metrics-contract.md,
  # ~/agent/ninfer-pilot-task.md). Unlike llamacpp/externalApi above, ninfer
  # is an in-cluster Deployment (helm/ninfer-inference, make ninfer-up), so
  # host is a k8s Service DNS name, not host.k3d.internal -- Risk 1 in the
  # pilot brief: a host-run `docker run --gpus all` container is invisible to
  # k8s's own nvidia.com/gpu accounting and OOM-killed the live sglang pod
  # during testing. Requires the ninfer-api-key Secret from helm-up
  # (NINFER_API_KEY in .env).
  #
  # Its own model name (ADR 0019), matching helm/ninfer-inference's
  # servedModelName: ninfer cannot join EPP (ADR-0015 §6), so it is a direct
  # rule in llmd.yaml with no EPP queueing, fair share or priority bands. It
  # also rejects every `response_format` except `{"type":"text"}` (no
  # constrained/JSON-schema decoding, confirmed against upstream
  # docs/serving.md); clients that need JSON mode stay on qwen-3.8-27b. See
  # deploy/ninfer/README.md.
  ninfer:
    enabled: true
    host: ninfer-qwen38.airgap-ai-stack.svc.cluster.local
    port: 18080
    modelName: qwen-3.8-27b-ninfer
  # Strata (deploy/strata/README.md): Qwen3.8-Flash-Next IQ3_S as an
  # in-cluster Deployment (helm/strata-inference, make strata-up), its own
  # model name on a direct rule like ninfer -- no EPP queue or fair share.
  # Strata serves one request at a time behind its own FIFO. Requires the
  # strata-api-key Secret from helm-up (STRATA_API_KEY in .env).
  # Off: on this 48 GB WSL node the pod gets too little RAM for the experts
  # the GPU does not hold and runs 5-6x slower than on the host, so Strata
  # runs on the host as externalApi above. Do not enable both: they serve
  # the same model name.
  strata:
    enabled: false
    host: strata-flash-next.airgap-ai-stack.svc.cluster.local
    port: 8000
    modelName: qwen-3.8-flash-next
  # bge-m3 embeddings (docs/adr/0013-embeddings-api-bge-m3.md). Unlike
  # llamacpp/externalApi above, this flag also controls a second
  # AIGatewayRoute (templates/embeddings.yaml), not just a rule inside
  # `llmd` -- embeddings traffic must never enter the EPP queue that models
  # the LLM's slots. host/port is the embeddings-inference chart's Service
  # (helm/embeddings-inference, make embeddings-up), reachable regardless of
  # accelerator mode -- the Service name and port never change between modes.
  # enabled: true is an explicit operator decision (2026-09-14), made before
  # ADR-0013's own V4 (load-based rate-limit tuning) and V5 (retrieval
  # quality gate) closed -- the ADR is still status Proposed. perUserRateLimitPerMinute
  # and maxClientBatchSize below are still V4 placeholders, not measured.
  embeddings:
    enabled: true
    host: embeddings-bge-m3.airgap-ai-stack.svc.cluster.local
    port: 80
    modelName: bge-m3
    # Placeholder pending ADR-0013 V4's load numbers; sized for batch
    # indexing, not human chat, so it is deliberately far above
    # perUserRateLimitPerMinute above.
    perUserRateLimitPerMinute: 120
    # Must match helm/embeddings-inference values.yaml inference.maxClientBatchSize.
    maxClientBatchSize: 32
  # Hosted and remote inference APIs, routed by model name
  # (templates/inference-api.yaml, docs/adr/0025-api-inference-providers.md).
  # A provider is one upstream API (Backend + AIServiceBackend + key); a
  # model is a public model name with one or more provider targets. Models
  # get their own AIGatewayRoute(s) `inference-api-<n>`, never rules inside
  # `llmd`, so none of this touches the EPP pool or its catch-all. EPP does
  # not apply to these: there are no pods to score and no /metrics to read;
  # the knobs below (retry, priority fallback, passive health, concurrency
  # cap, token budget) are what stands in for it.
  api:
    # Requests to these routes, per user per minute -- the same storm guard
    # as perUserRateLimitPerMinute on `llmd`, separate counter.
    perUserRateLimitPerMinute: 60
    # Per-user token budget across all API models, total tokens per hour,
    # counted by the gateway from each response's usage. 0 disables it.
    tokensPerUserPerHour: 0
    timeouts:
      request: 10m
      streamIdle: 5m
    # Retried before response headers only (a started stream is never
    # retried). numAttemptsPerPriority: 1 sends each retry to the next
    # priority, so a model with a priority-1 target fails over on the first
    # retry instead of hammering the provider that just refused.
    retry:
      numRetries: 2
      numAttemptsPerPriority: 1
      httpStatusCodes: [429, 500, 502, 503, 504]
      backOff:
        baseInterval: 1s
        maxInterval: 10s
    # Outlier detection: a provider failing consecutive5XxErrors times in a
    # row is ejected for baseEjectionTime, shifting its traffic to the next
    # priority without waiting for a per-request retry.
    passiveHealth:
      consecutive5XxErrors: 3
      interval: 10s
      baseEjectionTime: 30s
    # Optional per-provider concurrency cap with an Envoy-side queue
    # (circuitBreaker). Empty keeps Envoy's defaults (1024/1024).
    circuitBreaker: {}
    #   maxParallelRequests: 32
    #   maxPendingRequests: 64
    # Identity headers pat-service sets for the in-cluster engines, EPP and
    # Langfuse, plus the ones Open WebUI forwards (ENABLE_FORWARD_USER_INFO_HEADERS,
    # v0.12.0 defaults for the names k8s/base does not override) that
    # pat-service passes through. All are removed before a request leaves
    # for a provider. Exact names only: headerMutation has no prefix match.
    privateHeaders:
      - X-User-Id
      - X-User-Name
      - X-Pat-Token-Id
      - X-Session-Key
      - Agent-Session-Id
      - X-Llm-D-Inference-Fairness-Id
      - X-Llm-D-Inference-Objective
      - X-OpenWebUI-User-Email
      - X-OpenWebUI-User-Role
      - X-OpenWebUI-Auth-Type
      - X-OpenWebUI-User-Jwt
      - X-OpenWebUI-Chat-Id
      - X-OpenWebUI-Message-Id
    # name -> provider. name is a DNS label; objects are api-<name>.
    #   schema:  OpenAI | AzureOpenAI | AWSBedrock | GCPVertexAI |
    #            GCPAnthropic | Cohere (AIServiceBackend schema.name).
    #            Anthropic/AWSAnthropic serve only /anthropic/v1/messages,
    #            which pat-service does not expose; use Anthropic's
    #            OpenAI-compatible endpoint (schema OpenAI) instead.
    #   prefix / version: schema.prefix / schema.version.
    #   host / port / tls: upstream endpoint; tls verifies against the
    #            system CAs with SNI = host.
    #   auth:    none | APIKey (Authorization: Bearer) | AnthropicAPIKey
    #            (x-api-key) | AzureAPIKey (api-key).
    #   apiKeyEnv: the .env key holding the secret (runtimeEnvironment).
    # Examples (OpenAI-compatible prefixes from the Envoy AI Gateway
    # provider table):
    #   anthropic: {schema: OpenAI, prefix: /v1, host: api.anthropic.com, port: 443, tls: true, auth: APIKey, apiKeyEnv: ANTHROPIC_API_KEY}
    #   gemini:    {schema: OpenAI, prefix: /v1beta/openai, host: generativelanguage.googleapis.com, port: 443, tls: true, auth: APIKey, apiKeyEnv: GEMINI_API_KEY}
    #   azure:     {schema: AzureOpenAI, version: 2025-01-01-preview, host: <resource>.openai.azure.com, port: 443, tls: true, auth: AzureAPIKey, apiKeyEnv: AZURE_OPENAI_API_KEY}
    #   site-b:    {schema: OpenAI, prefix: /v1, host: llm.site-b.internal, port: 443, tls: true, auth: APIKey, apiKeyEnv: SITE_B_PAT}
    providers:
      openai:
        enabled: false
        schema: OpenAI
        prefix: /v1
        host: api.openai.com
        port: 443
        tls: true
        auth: APIKey
        apiKeyEnv: OPENAI_API_KEY
    # Public model names. Each target: provider, model (the provider's own
    # name, default: the public name), optional priority (0 first, higher =
    # fallback) and weight (split within one priority, e.g. two accounts).
    # All targets of one name must serve the same model: `model` differs
    # only where providers name it differently. Failover never swaps in a
    # different model (ADR 0025 decision 2); a client picks another model
    # by asking for another name.
    # Targets on a disabled provider are dropped; a model with none left is
    # not routed. A name already served in-cluster is a render error.
    # Price every model in pat-service-pricing (k8s/base/applications.yaml),
    # or it is costed at "_default".
    #   - name: gpt-5-mini
    #     targets:
    #       - provider: openai
    #   - name: claude-sonnet
    #     targets:
    #       - provider: anthropic
    #         model: claude-sonnet-4-5
    #       - provider: site-b
    #         model: claude-sonnet
    #         priority: 1
    models: []

# --- Routing / ingress -------------------------------------------------------
# Browser-facing traffic uses one canonical origin and path routing. Cluster
# workloads use Kubernetes Service DNS; neither depends on the Windows host
# name or a k3d load-balancer IP.
routing:
  edge:
    # Public listener reached through the TLS-terminating Synology proxy.
    externalPort: 3091
  # External app group is distinguished only by URL path, never Host.
  external:
    ssoPath: /sso              # -> keycloak
    platformPath: /platform    # -> pat-service (PAT management dashboard + /api/tokens)
    apiPath: /v1               # -> pat-service (OpenAI-compatible reverse proxy)
    # default (no path) -> openwebui
  nodePorts:
    grafana: 32030
    langfuse: 32031

# --- Model cache (docs/adr/0019) -------------------------------------------------
# models/checksums.txt for the model-cache ConfigMap; `make helm-up` sets it
# with --set-file. Empty renders no ConfigMap.
modelCache:
  checksums: ""

# --- OIDC / SSO --------------------------------------------------------------
# The sole browser-facing origin. Keycloak issuer and OAuth callbacks must be
# stable absolute URLs; no workload uses the Windows host name as an endpoint.
oidc:
  publicBaseURL: https://ai.example.com
  # Realm name used in Keycloak URL paths.
  realm: ai-stack
  # Fully-qualified external issuer for the browser clients. Includes the
  # /sso path-prefix Keycloak runs under (KC_HTTP_RELATIVE_PATH). Matches
  # KC_HOSTNAME so JWT iss claims line up with what the realm returns.
  externalIssuer: https://ai.example.com/sso/realms/ai-stack
  # Internal-issuer URL used by services that talk to Keycloak over the
  # cluster-internal service DNS (no /sso rewrite needed; Envoy handles that).
  internalIssuer: http://keycloak.airgap-ai-stack.svc.cluster.local:8080/sso/realms/ai-stack
  internalAIGatewayURL: http://ai-gateway-private.envoy-gateway-system.svc.cluster.local:8080

# --- DeepSeek Harness web UI (docs/adr/0020) --------------------------------
# helm-up sets publicOrigin from .env DSH_PUBLIC_ORIGIN; empty = no route.
# templates/dsh-web.yaml: host route + edge OIDC to agent-broker's web proxy.
dshWeb:
  publicOrigin: ""
  clientID: dsh-web

# --- Open WebUI MCP tool servers ----------------------------------------------
# Rendered into the ConfigMap openwebui-tool-servers (templates/
# openwebui-tool-servers.yaml), one entry per server whose flag is "true" in
# runtimeEnvironment (.env). Owned by this chart since ADR 0018 section 7
# (amends ADR 0017 section 6): TOOL_SERVER_CONNECTIONS is one JSON list, so
# the web-search and repowise releases cannot each own it. Open WebUI reads
# it only at start; websearch-up/-down and repowise-up/-down restart it.
openwebuiToolServers:
  - flag: WEB_SEARCH_ENABLED
    id: web-search
    name: Web search
    description: Search the public web and fetch pages (queries leave the company)
    url: http://pat-service.airgap-ai-stack.svc.cluster.local:8080/mcp/web-search/
  - flag: REPOWISE_ENABLED
    id: repowise
    name: Repowise
    description: Codebase intelligence over the indexed repositories (docs, search, dependency graph, history)
    url: http://pat-service.airgap-ai-stack.svc.cluster.local:8080/mcp/repowise/
