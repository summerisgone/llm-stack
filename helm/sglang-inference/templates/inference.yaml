apiVersion: v1
kind: Service
metadata:
  name: {{ .Values.name }}
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: {{ .Values.name }}
spec:
  selector:
    app.kubernetes.io/name: {{ .Values.name }}
  ports:
    - name: http
      port: {{ .Values.inference.port }}
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Values.name }}
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: {{ .Values.name }}
spec:
  replicas: {{ .Values.replicas }}
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ .Values.name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ .Values.name }}
    spec:
      runtimeClassName: {{ .Values.runtimeClassName }}
      enableServiceLinks: false
      nodeSelector:
        kubernetes.io/hostname: {{ .Values.nodeName }}
      containers:
        - name: sglang
          image: {{ .Values.image | quote }}
          imagePullPolicy: IfNotPresent
          command: ["/bin/bash", "-lc"]
          args:
            - |
              exec sglang serve \
                --model-path /model \
                --served-model-name {{ .Values.inference.servedModelName | quote }} \
                --host 0.0.0.0 \
                --port {{ .Values.inference.port }} \
                {{- if .Values.inference.trustRemoteCode }}
                --trust-remote-code \
                {{- end }}
                --attention-backend {{ .Values.inference.attentionBackend | quote }} \
                --mamba-ssm-dtype {{ .Values.inference.mambaSsmDtype | quote }} \
                --mamba-radix-cache-strategy {{ .Values.inference.mambaRadixCacheStrategy | quote }} \
                --chunked-prefill-size {{ .Values.inference.chunkedPrefillSize | quote }} \
                --reasoning-parser {{ .Values.inference.reasoningParser | quote }} \
                --tool-call-parser {{ .Values.inference.toolCallParser | quote }} \
                --mm-feature-transport {{ .Values.inference.mmFeatureTransport | quote }} \
                --enable-cache-report \
                --enable-metrics \
                --context-length {{ .Values.inference.contextLength | quote }} \
                --max-running-requests {{ .Values.inference.maxRunningRequests | quote }} \
                --cuda-graph-max-bs-decode {{ .Values.inference.cudaGraphMaxBsDecode | quote }} \
                --max-mamba-cache-size {{ .Values.inference.maxMambaCacheSize | quote }} \
                --mem-fraction-static {{ .Values.inference.memFractionStatic | quote }} \
                --kv-cache-dtype {{ .Values.inference.kvCacheDtype | quote }} \
                {{- with .Values.inference.mambaFullMemoryRatio }}
                --mamba-full-memory-ratio {{ . | quote }} \
                {{- end }}
                --api-key "$(SGLANG_API_KEY)"
          env:
            - name: SGLANG_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.apiKeySecret }}
                  key: apiKey
            - name: HF_HUB_OFFLINE
              value: "1"
            - name: TRANSFORMERS_OFFLINE
              value: "1"
            - name: NVIDIA_VISIBLE_DEVICES
              value: all
            - name: NVIDIA_DRIVER_CAPABILITIES
              value: compute,utility
            - name: LD_LIBRARY_PATH
              value: /usr/lib/x86_64-linux-gnu:/usr/lib64:/usr/local/nvidia/lib:/usr/local/nvidia/lib64
          ports:
            - name: http
              containerPort: {{ .Values.inference.port }}
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 60
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 120
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 600
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: model
              mountPath: /model
              readOnly: true
            - name: dshm
              mountPath: /dev/shm
      volumes:
        - name: model
          persistentVolumeClaim:
            claimName: {{ .Values.modelClaim }}
        - name: dshm
          emptyDir:
            medium: Memory
            sizeLimit: 16Gi
