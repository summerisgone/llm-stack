apiVersion: v1
kind: Service
metadata:
  name: {{ .Values.name }}
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: {{ .Values.name }}
spec:
  selector:
    app.kubernetes.io/name: {{ .Values.name }}
  ports:
    - name: http
      port: {{ .Values.inference.port }}
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Values.name }}
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: {{ .Values.name }}
spec:
  replicas: {{ .Values.replicas }}
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ .Values.name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ .Values.name }}
        # EPP's core-metrics-extractor reads this to pick the engine's
        # metric names (queue, KV usage); the GAIE key is the fallback older
        # EPP builds read.
        llm-d.ai/engine-type: sglang
        inference.networking.k8s.io/engine-type: sglang
        # The model's InferencePool selects its pods by this label, whatever
        # the engine (ADR 0019); the NetworkPolicy in helm/airgap-stack
        # admits only EPP and Prometheus to them.
        llm-d.ai/model: {{ .Values.inference.servedModelName | quote }}
    spec:
      runtimeClassName: {{ .Values.runtimeClassName }}
      enableServiceLinks: false
      nodeSelector:
        {{- toYaml .Values.nodeSelector | nindent 8 }}
      tolerations:
        {{- toYaml .Values.tolerations | nindent 8 }}
      initContainers:
        # ADR 0019: fill this node's model cache from MinIO and verify it
        # against models/checksums.txt before the engine starts.
        - name: model-cache
          image: {{ .Values.modelCache.image | quote }}
          imagePullPolicy: IfNotPresent
          command: ["sh", "/scripts/model-cache-fill.sh", {{ .Values.modelCache.model | quote }}]
          env:
            - name: MINIO_URL
              value: {{ .Values.modelCache.minioURL | quote }}
          securityContext:
            # The hostPath cache directory is created root-owned.
            runAsUser: 0
          volumeMounts:
            - name: model
              mountPath: /cache
            - name: model-cache-scripts
              mountPath: /scripts
              readOnly: true
      containers:
        - name: sglang
          image: {{ .Values.image | quote }}
          imagePullPolicy: IfNotPresent
          command: ["/bin/bash", "-lc"]
          args:
            - |
              exec sglang serve \
                --model-path /model \
                --served-model-name {{ .Values.inference.servedModelName | quote }} \
                --host 0.0.0.0 \
                --port {{ .Values.inference.port }} \
                {{- if .Values.inference.trustRemoteCode }}
                --trust-remote-code \
                {{- end }}
                --attention-backend {{ .Values.inference.attentionBackend | quote }} \
                --mamba-ssm-dtype {{ .Values.inference.mambaSsmDtype | quote }} \
                --mamba-radix-cache-strategy {{ .Values.inference.mambaRadixCacheStrategy | quote }} \
                --chunked-prefill-size {{ .Values.inference.chunkedPrefillSize | quote }} \
                --reasoning-parser {{ .Values.inference.reasoningParser | quote }} \
                --tool-call-parser {{ .Values.inference.toolCallParser | quote }} \
                --mm-feature-transport {{ .Values.inference.mmFeatureTransport | quote }} \
                --enable-cache-report \
                --enable-metrics \
                --context-length {{ .Values.inference.contextLength | quote }} \
                --max-running-requests {{ .Values.inference.maxRunningRequests | quote }} \
                --cuda-graph-max-bs-decode {{ .Values.inference.cudaGraphMaxBsDecode | quote }} \
                --max-mamba-cache-size {{ .Values.inference.maxMambaCacheSize | quote }} \
                --mem-fraction-static {{ .Values.inference.memFractionStatic | quote }} \
                --kv-cache-dtype {{ .Values.inference.kvCacheDtype | quote }} \
                {{- with .Values.inference.mambaFullMemoryRatio }}
                --mamba-full-memory-ratio {{ . | quote }} \
                {{- end }}
          env:
            - name: HF_HUB_OFFLINE
              value: "1"
            - name: TRANSFORMERS_OFFLINE
              value: "1"
            - name: NVIDIA_VISIBLE_DEVICES
              value: all
            - name: NVIDIA_DRIVER_CAPABILITIES
              value: compute,utility
            - name: LD_LIBRARY_PATH
              value: /usr/lib/x86_64-linux-gnu:/usr/lib64:/usr/local/nvidia/lib:/usr/local/nvidia/lib64
          ports:
            - name: http
              containerPort: {{ .Values.inference.port }}
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 60
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 120
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 600
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: model
              mountPath: /model
              subPath: {{ .Values.modelCache.model }}
              readOnly: true
            - name: dshm
              mountPath: /dev/shm
      volumes:
        - name: model
          hostPath:
            path: {{ .Values.modelCache.hostPath }}
            type: DirectoryOrCreate
        - name: model-cache-scripts
          configMap:
            name: model-cache
        - name: dshm
          emptyDir:
            medium: Memory
            sizeLimit: 16Gi
