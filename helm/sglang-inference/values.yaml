name: sglang-qwen38
image: lmsysorg/sglang:v0.5.19@sha256:d6e7288627be8b02be88e4bba38e73f6d50e2826869f753c13a4c4385ab3eda9
replicas: 1
runtimeClassName: nvidia
# ADR 0019: GPU pods go to any labelled, tainted inference worker, never to
# a named node.
nodeSelector:
  node-role/inference: "true"
tolerations:
  - key: nvidia.com/gpu
    operator: Exists
    effect: NoSchedule
# ADR 0019: weights come from MinIO bucket `models` into this node's cache
# (hostPath), filled and checked against models/checksums.txt by the
# model-cache initContainer before the engine starts. `model` is the name in
# models/manifest.yaml; the image is versions.lock.env MODEL_CACHE_IMAGE
# (rclone, sh, sha256sum).
modelCache:
  model: RadixArk-Qwen3.8-27B-NVFP4
  hostPath: /var/lib/llm-stack/models
  minioURL: http://minio.airgap-ai-stack.svc.cluster.local
  image: docker.io/rclone/rclone:1.71.1@sha256:d5971950c2b370fb04dd3292541b5bda6d9103143fd7e345aeb435a399388afc

inference:
  servedModelName: qwen-3.8-27b
  # Every pod of a pool listens on the same port (ADR 0019); no --api-key,
  # the NetworkPolicy in helm/airgap-stack restricts who reaches it.
  port: 8000
  # GPUs per pod (--tp-size); keep resources' nvidia.com/gpu equal to it.
  tensorParallelSize: 1
  # GPU-only profile validated on RTX 5090 with three admission slots and no
  # speculative decoding. See ADR 0010 and the 2026-09-08 tuning results.
  trustRemoteCode: true
  contextLength: 180224
  memFractionStatic: "0.90"
  kvCacheDtype: auto
  maxRunningRequests: 3
  cudaGraphMaxBsDecode: 3
  maxMambaCacheSize: 12
  # mambaFullMemoryRatio: omitted - agents_nospec uses the sglang default
  # speculative: omitted - no MTP here (agents_nospec). Set it to use the
  # checkpoint's MTP layer: {algorithm, numSteps, eagleTopk, numDraftTokens}.
  mambaSsmDtype: bfloat16
  mambaRadixCacheStrategy: extra_buffer_lazy
  chunkedPrefillSize: 2048
  attentionBackend: flashinfer
  reasoningParser: qwen3
  toolCallParser: qwen3_coder
  mmFeatureTransport: cpu

resources:
  requests:
    cpu: "4"
    memory: 8Gi
    nvidia.com/gpu: "1"
  limits:
    cpu: "8"
    memory: 24Gi
    nvidia.com/gpu: "1"
