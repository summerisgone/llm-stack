name: ninfer-qwen38
# Not published upstream (github.com/Neroued/ninfer ships only a Dockerfile,
# no prebuilt image, tag, or release). Built and pushed by
# .github/workflows/ninfer-image.yml (verified: run 35439158747, 2026-09-19,
# concluded success) from the commit pinned in versions.lock.env
# NINFER_UPSTREAM_REF. Pinned to the immutable ninfer-<short-ref> tag, not
# :latest -- this node already had a *locally imported* image cached under
# the :latest tag from an earlier manual `k3d image import` bring-up, and
# imagePullPolicy: IfNotPresent would silently keep serving that stale copy
# forever even after :latest gets overwritten in the registry. The immutable
# tag forces a real pull the first time, and never silently goes stale
# after. Also the NINFER_IMAGE value in versions.lock.env; keep the two in
# step, same convention as SGLANG_IMAGE/helm/sglang-inference -- update both
# together on a rebuild.
image: ghcr.io/summerisgone/ninfer:ninfer-9e163eee4b8a
replicas: 1
runtimeClassName: nvidia
nodeName: k3d-llm-stack-server-0
# ninfer's own `.ninfer` v3 artifact, built via ninfer's weight-conversion
# pipeline (upstream docs/weight-conversion.md) -- NOT the same file as the
# safetensors checkpoint on vllm-qwen38-nvfp4-model. Separate PVC created by
# k8s/overlays/remote-wsl-vllm-nvfp4/ninfer-model-volume.yaml (gpu-objects-up).
modelClaim: ninfer-qwen38-nvfp4-model
modelFile: qwen3_8_27b_nvfp4.ninfer
# Secret containing the `apiKey` field; created by inference-backends.yaml
# when NINFER_API_KEY is set in the airgap-stack release (same pattern as
# sglang-api-key).
apiKeySecret: ninfer-api-key

inference:
  # Public OpenAI model id advertised by ninfer-serve (--model-id) and
  # matched by inference.ninfer.modelName in helm/airgap-stack/values.yaml --
  # keep these two in sync. Deliberately the same canonical name vLLM/SGLang
  # use (qwen-3.8-27b), not a ninfer-specific one: when
  # inference.ninfer.live is true, the shared AIGatewayRoute rule for this
  # name points at ninfer instead of EPP, so a client's `model` field never
  # changes across an engine swap. See helm/airgap-stack/values.yaml's
  # ninfer.live comment for the swap's cost (no EPP fair-share, no JSON
  # response_format) while this is live.
  servedModelName: qwen-3.8-27b
  port: 18080
  # Sizing carried over from the pilot brief's manual comparison run (RTX
  # 5090, same NVFP4 checkpoint family as vllm/sglang). Re-tune against this
  # deployment's actual traffic shape before calling it more than a pilot --
  # see deploy/ninfer/README.md "Known risks", Risk 2.
  maxContext: 180224
  # Explicit, not auto: ADR 0018 section 6a carves VRAM for GPU embeddings
  # (helm/embeddings-inference gpu.gpuMemoryBudgetGiB). Unit is tokens
  # (server_start kv_capacity; 64 tokens per page group, ~2.14 MiB each at
  # fp8). auto gave 250304; 196608 frees ~1.75 GiB and still fits one
  # maxContext request. Change together with gpuMemoryBudgetGiB, one commit.
  kvCapacity: "196608"
  maxConcurrency: 3
  kvDtype: fp8
  # Positive multiple of 128 (enforced by ninfer-serve). Smaller values slice
  # a large cold prefill into more, shorter admitted chunks -- the knob to
  # try first against Risk 2 (cold-prefill head-of-line blocking). Unverified
  # here: this repo has not load-tested a non-default value.
  prefillChunk: 1024
  pendingTimeoutMs: 180000
  spec: mtp
  draftTokens: 3
  lmHeadDraft: true
  requestLogPath: /var/log/ninfer/requests.jsonl

# Tier 2/3 sidecar: tails inference.requestLogPath and re-exposes it as
# Prometheus text format on :9400/metrics (helm/ninfer-inference/files/jsonl_exporter.py).
# ninfer has no native /metrics route -- see docs/adr/0015-third-party-engine-metrics-contract.md
# and deploy/ninfer/README.md. Plain python3 image: the exporter only reads a
# shared emptyDir file, it needs no GPU access and no ninfer-specific runtime.
metricsExporter:
  enabled: true
  image: python:3.12-slim
  port: 9400

resources:
  requests:
    cpu: "4"
    memory: 8Gi
    nvidia.com/gpu: "1"
  limits:
    cpu: "8"
    memory: 24Gi
    nvidia.com/gpu: "1"
