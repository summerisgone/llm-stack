apiVersion: v1
kind: Service
metadata:
  name: {{ .Values.name }}
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: {{ .Values.name }}
spec:
  selector:
    app.kubernetes.io/name: {{ .Values.name }}
  ports:
    - name: http
      port: {{ .Values.inference.port }}
      targetPort: http
    {{- if .Values.metricsExporter.enabled }}
    - name: metrics
      port: {{ .Values.metricsExporter.port }}
      targetPort: metrics
    {{- end }}
---
{{- if .Values.metricsExporter.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Values.name }}-metrics-exporter
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: {{ .Values.name }}
data:
  jsonl_exporter.py: |
{{ .Files.Get "files/jsonl_exporter.py" | indent 4 }}
---
{{- end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Values.name }}
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: {{ .Values.name }}
spec:
  replicas: {{ .Values.replicas }}
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ .Values.name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ .Values.name }}
    spec:
      runtimeClassName: {{ .Values.runtimeClassName }}
      enableServiceLinks: false
      nodeSelector:
        kubernetes.io/hostname: {{ .Values.nodeName }}
      containers:
        - name: ninfer
          image: {{ .Values.image | quote }}
          imagePullPolicy: IfNotPresent
          command: ["ninfer-serve"]
          args:
            - "/model/{{ .Values.modelFile }}"
            - "--host"
            - "0.0.0.0"
            - "--port"
            - {{ .Values.inference.port | quote }}
            - "--model-id"
            - {{ .Values.inference.servedModelName | quote }}
            - "--max-context"
            - {{ .Values.inference.maxContext | quote }}
            - "--kv-capacity"
            - {{ .Values.inference.kvCapacity | quote }}
            - "--max-concurrency"
            - {{ .Values.inference.maxConcurrency | quote }}
            - "--kv-dtype"
            - {{ .Values.inference.kvDtype | quote }}
            - "--prefill-chunk"
            - {{ .Values.inference.prefillChunk | quote }}
            - "--pending-timeout-ms"
            - {{ .Values.inference.pendingTimeoutMs | quote }}
            - "--spec"
            - {{ .Values.inference.spec | quote }}
            - "--draft-tokens"
            - {{ .Values.inference.draftTokens | quote }}
            {{- if .Values.inference.lmHeadDraft }}
            - "--lm-head-draft"
            {{- end }}
            - "--request-log-jsonl"
            - {{ .Values.inference.requestLogPath | quote }}
            - "--api-key"
            - "$(NINFER_API_KEY)"
          env:
            - name: NINFER_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.apiKeySecret }}
                  key: apiKey
            - name: NVIDIA_VISIBLE_DEVICES
              value: all
            - name: NVIDIA_DRIVER_CAPABILITIES
              value: compute,utility
          ports:
            - name: http
              containerPort: {{ .Values.inference.port }}
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 60
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 120
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 600
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            # PV is a single hostPath File (k8s/overlays/remote-wsl-vllm-nvfp4/ninfer-model-volume.yaml),
            # not a directory like vllm/sglang's -- mountPath must be the
            # exact file path, matching the args above.
            - name: model
              mountPath: /model/{{ .Values.modelFile }}
              readOnly: true
            - name: request-log
              mountPath: {{ dir .Values.inference.requestLogPath }}
        {{- if .Values.metricsExporter.enabled }}
        # Tier 2/3 adapter (docs/adr/0015): ninfer has no native /metrics, so
        # this reads the JSONL file the container above writes via
        # --request-log-jsonl (shared emptyDir, not a network call) and
        # re-exposes it as Prometheus text format. Plain python3 image, no
        # GPU request -- it never touches the model or the device.
        - name: metrics-exporter
          image: {{ .Values.metricsExporter.image | quote }}
          imagePullPolicy: IfNotPresent
          command: ["python3", "/opt/jsonl_exporter.py"]
          env:
            - name: NINFER_REQUEST_LOG
              value: {{ .Values.inference.requestLogPath | quote }}
            - name: NINFER_EXPORTER_PORT
              value: {{ .Values.metricsExporter.port | quote }}
          ports:
            - name: metrics
              containerPort: {{ .Values.metricsExporter.port }}
          livenessProbe:
            httpGet:
              path: /metrics
              port: metrics
            initialDelaySeconds: 10
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /metrics
              port: metrics
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: "50m"
              memory: 64Mi
            limits:
              cpu: "250m"
              memory: 256Mi
          volumeMounts:
            - name: request-log
              mountPath: {{ dir .Values.inference.requestLogPath }}
              readOnly: true
            - name: exporter-script
              mountPath: /opt/jsonl_exporter.py
              subPath: jsonl_exporter.py
              readOnly: true
        {{- end }}
      volumes:
        - name: model
          persistentVolumeClaim:
            claimName: {{ .Values.modelClaim }}
        - name: request-log
          emptyDir: {}
        {{- if .Values.metricsExporter.enabled }}
        - name: exporter-script
          configMap:
            name: {{ .Values.name }}-metrics-exporter
        {{- end }}
