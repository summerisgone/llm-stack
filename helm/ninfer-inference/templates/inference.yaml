apiVersion: v1
kind: Service
metadata:
  name: {{ .Values.name }}
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: {{ .Values.name }}
spec:
  selector:
    app.kubernetes.io/name: {{ .Values.name }}
  ports:
    - name: http
      port: {{ .Values.inference.port }}
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Values.name }}
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: {{ .Values.name }}
spec:
  replicas: {{ .Values.replicas }}
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ .Values.name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ .Values.name }}
    spec:
      runtimeClassName: {{ .Values.runtimeClassName }}
      enableServiceLinks: false
      nodeSelector:
        {{- toYaml .Values.nodeSelector | nindent 8 }}
      tolerations:
        {{- toYaml .Values.tolerations | nindent 8 }}
      initContainers:
        # ADR 0019: fill this node's model cache from MinIO and verify it
        # against models/checksums.txt before the engine starts.
        - name: model-cache
          image: {{ .Values.modelCache.image | quote }}
          imagePullPolicy: IfNotPresent
          command: ["sh", "/scripts/model-cache-fill.sh", {{ .Values.modelCache.model | quote }}]
          env:
            - name: MINIO_URL
              value: {{ .Values.modelCache.minioURL | quote }}
          securityContext:
            # The hostPath cache directory is created root-owned.
            runAsUser: 0
          volumeMounts:
            - name: model
              mountPath: /cache
            - name: model-cache-scripts
              mountPath: /scripts
              readOnly: true
      containers:
        - name: ninfer
          image: {{ .Values.image | quote }}
          imagePullPolicy: IfNotPresent
          command: ["ninfer-serve"]
          args:
            - "/model/{{ .Values.modelFile }}"
            - "--host"
            - "0.0.0.0"
            - "--port"
            - {{ .Values.inference.port | quote }}
            - "--model-id"
            - {{ .Values.inference.servedModelName | quote }}
            - "--max-context"
            - {{ .Values.inference.maxContext | quote }}
            - "--kv-capacity"
            - {{ .Values.inference.kvCapacity | quote }}
            - "--max-concurrency"
            - {{ .Values.inference.maxConcurrency | quote }}
            - "--kv-dtype"
            - {{ .Values.inference.kvDtype | quote }}
            - "--prefill-chunk"
            - {{ .Values.inference.prefillChunk | quote }}
            - "--pending-timeout-ms"
            - {{ .Values.inference.pendingTimeoutMs | quote }}
            - "--spec"
            - {{ .Values.inference.spec | quote }}
            - "--draft-tokens"
            - {{ .Values.inference.draftTokens | quote }}
            {{- if .Values.inference.lmHeadDraft }}
            - "--lm-head-draft"
            {{- end }}
            - "--api-key"
            - "$(NINFER_API_KEY)"
          env:
            - name: NINFER_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.apiKeySecret }}
                  key: apiKey
            - name: NVIDIA_VISIBLE_DEVICES
              value: all
            - name: NVIDIA_DRIVER_CAPABILITIES
              value: compute,utility
          ports:
            - name: http
              containerPort: {{ .Values.inference.port }}
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 60
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 120
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 600
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            # The cached model is a single file, not a directory like
            # vllm/sglang's -- mountPath must be the exact file path,
            # matching the args above.
            - name: model
              mountPath: /model/{{ .Values.modelFile }}
              subPath: {{ .Values.modelCache.model }}
              readOnly: true
      volumes:
        - name: model
          hostPath:
            path: {{ .Values.modelCache.hostPath }}
            type: DirectoryOrCreate
        - name: model-cache-scripts
          configMap:
            name: model-cache
