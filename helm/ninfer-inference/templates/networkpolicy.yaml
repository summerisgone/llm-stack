# A direct backend of the private AI Gateway (no endpoint picker in front):
# only the gateway may send inference, so every request passes pat-service's
# accounting first (docs/adr/0022 section 5). Prometheus scrapes metrics.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ .Values.name }}
  namespace: {{ .Release.Namespace }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: {{ .Values.name }}
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: envoy-gateway-system
          podSelector:
            matchLabels:
              gateway.envoyproxy.io/owning-gateway-name: ai-gateway-private
      ports:
        - port: {{ .Values.inference.port }}
          protocol: TCP
    {{- if .Values.metricsExporter.enabled }}
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: prometheus
      ports:
        - port: {{ .Values.metricsExporter.port }}
          protocol: TCP
    {{- end }}
