apiVersion: v1
kind: Service
metadata:
  name: web-search
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: web-search
spec:
  selector:
    app.kubernetes.io/name: web-search
  ports:
    - name: http
      port: 80
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web-search
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: web-search
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: web-search
  template:
    metadata:
      labels:
        app.kubernetes.io/name: web-search
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
    spec:
      enableServiceLinks: false
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: openserp
          image: {{ required "image.openserp (OPENSERP_IMAGE)" .Values.image.openserp | quote }}
          imagePullPolicy: IfNotPresent
          args: ["serve", "--leakless", "--config", "/etc/openserp/config.yaml"]
          env:
            - name: OPENSERP_SERVER_HOST
              value: 127.0.0.1
            - name: OPENSERP_SERVER_PORT
              value: "7000"
          securityContext:
            runAsUser: 1001
            runAsGroup: 1001
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          resources:
            {{- toYaml .Values.openserp.resources | nindent 12 }}
          volumeMounts:
            - name: config
              mountPath: /etc/openserp/config.yaml
              subPath: config.yaml
              readOnly: true
            - name: dshm
              mountPath: /dev/shm
            - name: chrome-tmp
              mountPath: /tmp
        - name: sidecar
          image: {{ required "image.sidecar (NGINX_UNPRIVILEGED_IMAGE)" .Values.image.sidecar | quote }}
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
          securityContext:
            runAsUser: 101
            runAsGroup: 101
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 200m
              memory: 64Mi
          volumeMounts:
            - name: config
              mountPath: /etc/nginx/nginx.conf
              subPath: nginx.conf
              readOnly: true
            - name: nginx-tmp
              mountPath: /tmp
      volumes:
        - name: config
          configMap:
            name: web-search
        - name: dshm
          emptyDir:
            medium: Memory
            sizeLimit: {{ .Values.openserp.shmSize }}
        - name: chrome-tmp
          emptyDir:
            sizeLimit: 1Gi
        - name: nginx-tmp
          emptyDir:
            sizeLimit: 64Mi
