apiVersion: v1
kind: Service
metadata:
  name: web-search-mcp
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: web-search-mcp
spec:
  selector:
    app.kubernetes.io/name: web-search-mcp
  ports:
    - name: http
      port: 8080
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web-search-mcp
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: web-search-mcp
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: web-search-mcp
  template:
    metadata:
      labels:
        app.kubernetes.io/name: web-search-mcp
    spec:
      enableServiceLinks: false
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: web-search-mcp
          image: {{ required "image.mcp (WEB_SEARCH_MCP_IMAGE)" .Values.image.mcp | quote }}
          imagePullPolicy: IfNotPresent
          env:
            - name: SEARCH_URL
              value: http://web-search.{{ .Release.Namespace }}.svc.cluster.local
            - name: FETCH_MAX_CHARS
              value: {{ .Values.mcp.fetchMaxChars | quote }}
            - name: FETCH_MAX_BYTES
              value: {{ .Values.mcp.fetchMaxBytes | int64 | quote }}
            - name: FETCH_TIMEOUT_SECONDS
              value: {{ .Values.mcp.fetchTimeoutSeconds | quote }}
            - name: SEARCH_TIMEOUT_SECONDS
              value: {{ add .Values.openserp.megaTimeoutSeconds 10 | quote }}
            - name: EXTRA_DENY_CIDRS
              value: {{ .Values.mcp.extraDenyCIDRs | quote }}
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
          securityContext:
            runAsUser: 10001
            runAsGroup: 10001
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          resources:
            {{- toYaml .Values.mcp.resources | nindent 12 }}
