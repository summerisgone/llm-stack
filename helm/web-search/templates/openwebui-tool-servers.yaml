# Read by the Open WebUI Deployment as TOOL_SERVER_CONNECTIONS through a
# configMapKeyRef with optional: true (k8s/overlays/remote-wsl-vllm-nvfp4/
# openwebui-web-search-patch.yaml). Owned by this release so the connection
# exists exactly while web search is installed. system_oauth sends the chat
# user's Keycloak access token; pat-service validates it (ADR 0017 section 6).
# config.enable is the admin switch; access_grants "user *" read makes it
# visible to every signed-in user (none = admin-only); users still enable the
# tool per chat.
apiVersion: v1
kind: ConfigMap
metadata:
  name: openwebui-tool-servers
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: web-search
data:
  TOOL_SERVER_CONNECTIONS: |
    {{- list (dict
      "type" "mcp"
      "url" .Values.openwebui.mcpURL
      "path" ""
      "auth_type" "system_oauth"
      "key" ""
      "config" (dict "enable" true "access_grants" (list (dict "principal_type" "user" "principal_id" "*" "permission" "read")))
      "info" (dict "id" "web-search" "name" "Web search" "description" "Search the public web and fetch pages (queries leave the company)")
    ) | toJson | nindent 4 }}
