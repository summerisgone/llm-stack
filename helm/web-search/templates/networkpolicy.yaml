# ADR 0017 sections 2-3. Enforcement depends on the CNI's policy controller
# (k3s kube-router: verified for k8s/hermes, see docs/operations/hermes.md).
# web-search (OpenSERP + sidecar): reachable from web-search-mcp only.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: web-search
  namespace: {{ .Release.Namespace }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: web-search
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: web-search-mcp
      ports:
        - port: 8080
          protocol: TCP
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
            except:
              {{- toYaml .Values.egressExcept | nindent 14 }}
      ports:
        - port: 80
          protocol: TCP
        - port: 443
          protocol: TCP
---
# web-search-mcp: reachable from pat-service only. pat-service is what makes
# X-User-Id / X-Pat-Token-Id trustworthy here.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: web-search-mcp
  namespace: {{ .Release.Namespace }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: web-search-mcp
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: pat-service
      ports:
        - port: 8080
          protocol: TCP
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: web-search
      ports:
        - port: 8080
          protocol: TCP
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
            except:
              {{- toYaml .Values.egressExcept | nindent 14 }}
      ports:
        - port: 80
          protocol: TCP
        - port: 443
          protocol: TCP
