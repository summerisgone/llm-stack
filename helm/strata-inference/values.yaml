name: strata-flash-next
# Not published upstream (github.com/Niko1221/Strata ships a Dockerfile, no
# image). Built on the GPU host from the commit pinned in versions.lock.env
# STRATA_UPSTREAM_REF with CUDA_ARCHITECTURES=120 BUILD_VISION=0 and loaded
# with `k3d image import` (deploy/strata/README.md). Also STRATA_IMAGE in
# versions.lock.env; keep the two in step.
image: ghcr.io/summerisgone/strata:strata-db4f91a1171d
replicas: 1
runtimeClassName: nvidia
# ADR 0019: GPU pods go to any labelled, tainted inference worker.
nodeSelector:
  node-role/inference: "true"
tolerations:
  - key: nvidia.com/gpu
    operator: Exists
    effect: NoSchedule
# ADR 0019: weights come from MinIO bucket `models` into this node's cache,
# checked against models/checksums.txt by the model-cache initContainer.
# The directory holds what Strata's setup.py prepares for IQ3_S: the two GGUF
# shards (models/IQ3_S), the native pack with the low-RAM experts.bin
# (packs/iq3_s) and the MTP draft layer (mtp/rt).
modelCache:
  model: strata-qwen3.8-flash-next-iq3_s
  hostPath: /var/lib/llm-stack/models
  minioURL: http://minio.airgap-ai-stack.svc.cluster.local
  image: docker.io/rclone/rclone:1.71.1@sha256:d5971950c2b370fb04dd3292541b5bda6d9103143fd7e345aeb435a399388afc
# Secret with the `apiKey` field; created by inference-backends.yaml when
# STRATA_API_KEY is set in the airgap-stack release.
apiKeySecret: strata-api-key

inference:
  # Matches inference.strata.modelName in helm/airgap-stack/values.yaml.
  servedModelName: qwen-3.8-flash-next
  port: 8000
  quant: IQ3_S
  maxContext: 131072
  kv: int8
  # MTP speculative decoding, setup.py's defaults.
  spec: 4
  specMinP: 0.5
  # Strata fills the VRAM free at start with experts and keeps this much
  # free. 700 is its default; +3072 for GPU embeddings (helm/embeddings-
  # inference gpu.gpuMemoryBudgetGiB), which engines-up starts after it.
  vramReserveMiB: 3772

# ADR 0015 Tier 2/3 adapter: Strata's /metrics is JSON (the Monitor tab's
# feed), not Prometheus text. files/metrics_exporter.py re-exposes it on
# :9400/metrics.
metricsExporter:
  enabled: true
  image: python:3.12-slim
  port: 9400

# Low-RAM mode page-locks ~28 GiB of experts the GPU does not hold
# (measured on the WSL host, 48 GB RAM).
resources:
  requests:
    cpu: "4"
    memory: 32Gi
    nvidia.com/gpu: "1"
  limits:
    cpu: "16"
    memory: 40Gi
    nvidia.com/gpu: "1"
