# docs/adr/0024 decision 10. Default deny in the credentials namespace;
# OpenBao is reached by its two consumers only and talks to nothing but the
# Kubernetes API (TokenReview). cred-gateway's policy is in its own chart.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny
  namespace: {{ .Release.Namespace }}
spec:
  podSelector: {}
  policyTypes: [Ingress, Egress]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: openbao
  namespace: {{ .Release.Namespace }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: openbao
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Values.stackNamespace }}
          podSelector:
            matchLabels:
              app.kubernetes.io/name: pat-service
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: cred-gateway
      ports:
        - port: 8200
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - {port: 53, protocol: UDP}
        - {port: 53, protocol: TCP}
    # Kubernetes API. Policies match the endpoint port after Service DNAT:
    # 6443 on k3s/k3d.
    - ports:
        - port: 443
        - port: 6443
